<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Corrigir Comissão</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: #667eea;
  padding: 20px;
}
.container {
  background: white;
  padding: 30px;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  text-align: center;
  max-width: 400px;
}
h1 { color: #333; }
p { color: #666; margin: 15px 0; }
button {
  background: #4CAF50;
  color: white;
  padding: 12px 25px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 16px;
}
button:hover { background: #45a049; }
.resultado {
  margin-top: 20px;
  padding: 15px;
  border-radius: 5px;
  display: none;
}
.sucesso {
  background: #e8f5e9;
  color: #2e7d32;
  display: block;
}
.erro {
  background: #ffebee;
  color: #c62828;
  display: block;
}
</style>
</head>
<body>

<div class="container">
<h1>⚙️ Corrigir Comissão Nível 1</h1>
<p><strong>Problema:</strong> Recebeu R$ 6 em vez de R$ 3</p>
<p><strong>Solução:</strong> Remover R$ 3 da comissão</p>
<button onclick="corrigirComissao()">🔧 Corrigir Agora</button>
<div id="resultado" class="resultado"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="sistema-auth.js"></script>

<script>
async function corrigirComissao() {
  try {
    // Verificar login
    if (!window.SistemaAuth.verificarLogin((autenticado, dados) => {
      if (!autenticado) {
        mostrarResultado('❌ Você precisa estar logado', false);
        return;
      }
    })) {
      mostrarResultado('❌ Você precisa estar logado', false);
      return;
    }

    const uid = window.SistemaAuth.usuarioLogado?.uid;
    if (!uid) {
      mostrarResultado('❌ UID não encontrado', false);
      return;
    }

    const db = window.SistemaAuth.db;
    
    // Buscar comissão de nível 1 com valor 6
    const comissoesRef = db.collection("comissoes").where("usuarioId", "==", uid).where("nivel", "==", 1);
    const snapshot = await comissoesRef.get();
    
    let encontrou = false;
    
    snapshot.forEach(doc => {
      const comissao = doc.data();
      if (comissao.valorComissao === 6) {
        // Atualizar para 3
        db.collection("comissoes").doc(doc.id).update({
          valorComissao: 3,
          dataCorrecao: new Date().toISOString(),
          motivo: "Correção de comissão - taxa corrigida de 20% para 10%"
        }).then(() => {
          encontrou = true;
          mostrarResultado('✅ Comissão corrigida com sucesso! (6 → 3)', true);
        }).catch(err => {
          mostrarResultado('❌ Erro ao atualizar: ' + err.message, false);
        });
      }
    });

    if (!encontrou && snapshot.empty) {
      mostrarResultado('❌ Nenhuma comissão de R$ 6 encontrada', false);
    }

  } catch (error) {
    mostrarResultado('❌ Erro: ' + error.message, false);
  }
}

function mostrarResultado(mensagem, sucesso) {
  const div = document.getElementById('resultado');
  div.textContent = mensagem;
  div.className = 'resultado ' + (sucesso ? 'sucesso' : 'erro');
}
</script>

</body>
</html>
