<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIP Status do Usuário</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #2b2d42, #8d99ae);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 18px;
    }

    p {
      margin: 12px 0;
      line-height: 1.6;
      opacity: 0.95;
    }

    #vipStatus {
      white-space: pre-wrap;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      padding: 18px;
      margin-top: 16px;
      font-family: inherit;
      min-height: 120px;
    }

    select, button {
      width: 100%;
      padding: 14px 16px;
      margin-top: 14px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      outline: none;
    }

    select {
      background: rgba(255, 255, 255, 0.12);
      color: white;
    }

    button {
      background: #ffb703;
      color: #1d1d1d;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>VIP Status do Usuário</h1>
    <p>Este arquivo separado mostra o nível VIP real do usuário conectado e atualiza automaticamente ao receber o dado.</p>

    <div id="vipStatus">Carregando nível VIP...</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script>
    window.firebaseConfig = {
      apiKey: "AIzaSyAcVPgUHbL4N9U1-H68klmGKWQF-YGleyc",
      authDomain: "vastbitloud-2872a.firebaseapp.com",
      projectId: "vastbitloud-2872a",
      storageBucket: "vastbitloud-2872a.firebasestorage.app",
      messagingSenderId: "952931184412",
      appId: "1:952931184412:web:ee2a0e38826c30dd0cd4d9",
      measurementId: "G-KWVQ0CFHW2"
    };
  </script>
  <script type="module">
    import { mostrarNivelVIP, getBeneficiosPorVip } from './vip-status.js';

    const vipStatusElement = document.getElementById('vipStatus');

    function mostrarMensagem(mensagem) {
      vipStatusElement.innerText = mensagem;
      console.log(mensagem);
    }

    function inicializarFirebase() {
      if (!window.firebase) {
        mostrarMensagem('Erro: Firebase não foi carregado.');
        return false;
      }

      const config = window.firebaseConfig || null;
      if (!config || !config.apiKey || !config.projectId) {
        mostrarMensagem('Erro: Adicione sua configuração Firebase em window.firebaseConfig.');
        return false;
      }

      if (!firebase.apps.length) {
        firebase.initializeApp(config);
      }
      return true;
    }

    function carregarUsuario(uid) {
      if (!uid) {
        mostrarMensagem('Usuário não autenticado. Faça login para ver o VIP.');
        return;
      }

      const userDoc = firebase.firestore().collection('users').doc(uid);
      mostrarMensagem('Buscando dados VIP reais do usuário...');

      userDoc.onSnapshot(doc => {
        if (!doc.exists) {
          mostrarMensagem('Usuário encontrado, mas dados VIP não estão disponíveis.');
          return;
        }

        const dados = doc.data();
        const nivel = Number(dados.vipNivel ?? 0);
        const beneficios = getBeneficiosPorVip(nivel);

        const usuario = {
          vipNivel: nivel,
          taxaSaque: dados.taxaSaque != null ? dados.taxaSaque : beneficios.taxaSaque,
          limiteDiario: dados.limiteDiario != null ? dados.limiteDiario : beneficios.limiteDiario
        };

        mostrarNivelVIP(usuario);
      }, error => {
        mostrarMensagem('Erro ao ler dados do usuário: ' + error.message);
      });
    }

    function tentarFirebaseAuth() {
      firebase.auth().onAuthStateChanged(user => {
        if (user) {
          mostrarMensagem('Usuário logado. Carregando VIP...');
          carregarUsuario(user.uid);
        } else if (firebase.auth().currentUser) {
          const current = firebase.auth().currentUser;
          mostrarMensagem('Usuário logado. Carregando VIP...');
          carregarUsuario(current.uid);
        } else {
          mostrarMensagem('Nenhum usuário logado. Faça login para ver o VIP.');
        }
      });
    }

    function reconhecerLogin() {
      if (window.SistemaAuth && typeof window.SistemaAuth.verificarLogin === 'function') {
        window.SistemaAuth.verificarLogin((autenticado, dadosUsuario) => {
          if (autenticado && dadosUsuario && dadosUsuario.uid) {
            mostrarMensagem('Usuário logado. Carregando VIP...');
            carregarUsuario(dadosUsuario.uid);
          } else {
            tentarFirebaseAuth();
          }
        });
      } else {
        tentarFirebaseAuth();
      }
    }

    if (inicializarFirebase()) {
      reconhecerLogin();
    }
  </script>
</body>
</html>
