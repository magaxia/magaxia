<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Área VIP5</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0d0d0d;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      color: #888;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #222;
      border-top-color: #f5a623;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #content {
      display: none;
      width: 100%;
      max-width: 480px;
      flex-direction: column;
      gap: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #f5a623, #f0541e);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 100px;
    }

    .badge::before {
      content: "";
      width: 7px;
      height: 7px;
      background: #fff;
      border-radius: 50%;
      opacity: 0.85;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 2px;
    }

    .subtitle {
      font-size: 13px;
      color: #666;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #252525;
      border-radius: 14px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 2px;
    }

    .info-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .info-label {
      font-size: 11px;
      font-weight: 600;
      color: #555;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .info-value {
      font-size: 14px;
      color: #ddd;
      word-break: break-all;
    }

    .info-value.highlight {
      color: #f5a623;
      font-weight: 700;
      font-size: 16px;
    }

    .divider {
      height: 1px;
      background: #252525;
    }

    /* Countdown */
    .countdown-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #555;
    }

    .countdown-display {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px 14px;
      line-height: 1;
    }

    .cd-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .cd-number {
      font-size: 36px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
      min-width: 2ch;
      text-align: center;
    }

    .cd-unit {
      font-size: 10px;
      font-weight: 600;
      color: #555;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .cd-sep {
      font-size: 30px;
      font-weight: 300;
      color: #333;
      margin-bottom: 14px;
    }

    .countdown-expired {
      font-size: 14px;
      color: #e74c3c;
      font-weight: 600;
    }

    /* Progress */
    .progress-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .progress-label {
      font-size: 12px;
      color: #555;
    }

    .progress-pct {
      font-size: 12px;
      color: #555;
      font-variant-numeric: tabular-nums;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: #222;
      border-radius: 100px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 100px;
      background: linear-gradient(90deg, #f5a623, #f0541e);
      transition: width 1s linear;
    }

    /* ── Promoções ── */
    .promos-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .promo-card {
      background: #111;
      border: 1px solid #252525;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.2s;
    }

    .promo-card:hover {
      border-color: #333;
    }

    .promo-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .promo-titulo {
      font-size: 14px;
      font-weight: 700;
      color: #e8e8e8;
      line-height: 1.3;
    }

    .promo-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 100px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .promo-badge-vip      { background: #2a1e10; color: #f5a623; }
    .promo-badge-publica  { background: #1e2e3a; color: #3498db; }

    .promo-meta {
      font-size: 11px;
      color: #555;
    }

    .promo-info-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .promo-info-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .promo-info-label {
      font-size: 10px;
      font-weight: 600;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .promo-info-value {
      font-size: 12px;
      color: #aaa;
    }

    .btn-participar {
      width: 100%;
      padding: 11px;
      background: linear-gradient(135deg, #f5a623, #f0541e);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 2px;
    }

    .btn-participar:hover:not(:disabled) { opacity: 0.88; }
    .btn-participar:active:not(:disabled) { transform: scale(0.98); }
    .btn-participar:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      background: #333;
    }

    .promo-feedback {
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      min-height: 16px;
    }

    .promo-feedback.ok  { color: #27ae60; }
    .promo-feedback.err { color: #e74c3c; }

    .promos-empty {
      text-align: center;
      padding: 20px 0;
      color: #444;
      font-size: 13px;
    }

    .promos-loading {
      text-align: center;
      padding: 20px 0;
      color: #444;
      font-size: 13px;
    }

    .btn-logout {
      width: 100%;
      padding: 13px;
      background: transparent;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: #888;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      margin-top: 4px;
    }

    .btn-logout:hover {
      background: #1f1f1f;
      color: #ccc;
      border-color: #333;
    }

    #error-msg {
      display: none;
      text-align: center;
      color: #e74c3c;
      font-size: 14px;
      padding: 20px;
    }

    @media (max-width: 400px) {
      h1 { font-size: 19px; }
      .cd-number { font-size: 28px; }
      .cd-sep { font-size: 22px; }
    }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <span>Verificando acesso VIP...</span>
  </div>

  <div id="content">
    <div class="header">
      <div>
        <h1>Área VIP5</h1>
        <p class="subtitle">Seu acesso está ativo</p>
      </div>
      <span class="badge">VIP5</span>
    </div>

    <div class="card">
      <p class="card-title">Informações do acesso</p>

      <div class="info-row">
        <span class="info-label">UID do usuário</span>
        <span class="info-value" id="uid-value">—</span>
      </div>

      <div class="divider"></div>

      <div class="info-row">
        <span class="info-label">Código VIP</span>
        <span class="info-value highlight" id="code-value">—</span>
      </div>

      <div class="divider"></div>

      <div class="info-row">
        <span class="info-label">Data de ativação</span>
        <span class="info-value" id="activated-value">—</span>
      </div>

      <div class="divider"></div>

      <div class="info-row">
        <span class="info-label">Data de expiração</span>
        <span class="info-value" id="expires-value">—</span>
      </div>
    </div>

    <div class="card">
      <p class="card-title">Tempo restante</p>

      <div class="countdown-display" id="countdown-display">
        <div class="cd-block">
          <span class="cd-number" id="cd-days">00</span>
          <span class="cd-unit">dias</span>
        </div>
        <span class="cd-sep">:</span>
        <div class="cd-block">
          <span class="cd-number" id="cd-hours">00</span>
          <span class="cd-unit">horas</span>
        </div>
        <span class="cd-sep">:</span>
        <div class="cd-block">
          <span class="cd-number" id="cd-minutes">00</span>
          <span class="cd-unit">min</span>
        </div>
        <span class="cd-sep">:</span>
        <div class="cd-block">
          <span class="cd-number" id="cd-seconds">00</span>
          <span class="cd-unit">seg</span>
        </div>
      </div>

      <div class="progress-wrap">
        <div class="progress-header">
          <span class="progress-label">Consumido do plano</span>
          <span class="progress-pct" id="progress-pct">—</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
        </div>
      </div>
    </div>

    <!-- ══════════════════════════════════════════════════════════════ -->
    <!-- PROMOÇÕES VIP — seção nova                                     -->
    <!-- ══════════════════════════════════════════════════════════════ -->
    <div class="card" id="promos-card" style="display:none;flex-direction:column;gap:14px">
      <p class="card-title">Promoções disponíveis</p>
      <div class="promos-list" id="promos-list">
        <p class="promos-loading">Carregando promoções...</p>
      </div>
    </div>

    <button class="btn-logout" id="btn-logout">Sair da conta</button>
  </div>

  <p id="error-msg"></p>

  <script type="module">
    import { auth } from "./vip5-firebase.js";
    import { signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { checkVipExpiration } from "./vip5-expiration-manager.js";
    import {
      fetchVisiblePromotions,
      canParticipate,
      registerParticipation,
    } from "./vip5-promocoes-storage.js";

    console.log("[VIP5-USUARIO] Página carregada. Verificando expiração VIP...");

    let countdownTimer = null;
    let _currentUser   = null;
    let _currentVip    = null;

    function pad(n) {
      return String(Math.floor(n)).padStart(2, "0");
    }

    function formatDate(ts) {
      return new Date(ts).toLocaleString("pt-BR", {
        day: "2-digit", month: "2-digit", year: "numeric",
        hour: "2-digit", minute: "2-digit"
      });
    }

    function fmtDateShort(v) {
      if (!v) return "—";
      const d = typeof v.toDate === "function" ? v.toDate() : (v instanceof Date ? v : new Date(v));
      return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" });
    }

    function showError(msg) {
      console.error("[VIP5-USUARIO] Erro:", msg);
      if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
      document.getElementById("loading").style.display = "none";
      const errEl = document.getElementById("error-msg");
      errEl.textContent = msg;
      errEl.style.display = "block";
    }

    function startCountdown(expiresAt, activatedAt) {
      const totalMs = expiresAt - activatedAt;

      function tick() {
        const now         = Date.now();
        const remainingMs = expiresAt - now;

        if (remainingMs <= 0) {
          console.warn("[VIP5-USUARIO] Contagem chegou a zero. Verificando expiração...");
          clearInterval(countdownTimer);
          countdownTimer = null;

          document.getElementById("cd-days").textContent    = "00";
          document.getElementById("cd-hours").textContent   = "00";
          document.getElementById("cd-minutes").textContent = "00";
          document.getElementById("cd-seconds").textContent = "00";
          document.getElementById("progress-fill").style.width = "100%";
          document.getElementById("progress-pct").textContent  = "100% consumido";

          checkVipExpiration("vip5.html").catch((err) => {
            console.error("[VIP5-USUARIO] Erro ao re-verificar expiração:", err.code, err.message, err);
            window.location.href = "vip5.html";
          });
          return;
        }

        const days    = Math.floor(remainingMs / (1000 * 60 * 60 * 24));
        const hours   = Math.floor((remainingMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((remainingMs % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((remainingMs % (1000 * 60)) / 1000);

        document.getElementById("cd-days").textContent    = pad(days);
        document.getElementById("cd-hours").textContent   = pad(hours);
        document.getElementById("cd-minutes").textContent = pad(minutes);
        document.getElementById("cd-seconds").textContent = pad(seconds);

        const consumed  = Math.max(0, Math.min(100, Math.round(((totalMs - remainingMs) / totalMs) * 100)));
        document.getElementById("progress-fill").style.width = consumed + "%";
        document.getElementById("progress-pct").textContent  = consumed + "% consumido";
      }

      tick();
      countdownTimer = setInterval(tick, 1000);
      console.log("[VIP5-USUARIO] Contagem regressiva iniciada. Timer ID:", countdownTimer);
    }

    // ── Renderiza lista de promoções disponíveis ─────────────────────────────
    function renderPromos(promos, uid, vipData) {
      const container = document.getElementById("promos-list");
      const card      = document.getElementById("promos-card");

      if (!promos || promos.length === 0) {
        card.style.display = "none";
        return;
      }

      card.style.display = "flex";

      const toDate = (v) => {
        if (!v) return null;
        if (typeof v.toDate === "function") return v.toDate();
        return v instanceof Date ? v : new Date(v);
      };

      container.innerHTML = promos.map((p) => {
        const isVipEarly = p.dataVip && (!p.dataPublica || toDate(p.dataVip) <= new Date());
        const qty        = Number(p.quantidade) || 0;
        const parts      = Number(p.participacoes) || 0;
        const vagas      = qty === 0 ? "Ilimitadas" : `${qty - parts} restantes`;
        const dataFim    = fmtDateShort(p.dataFinal);
        const limite     = Number(p.limitePorUsuario) || 1;

        const accessBadge = isVipEarly
          ? `<span class="promo-badge promo-badge-vip">Acesso VIP</span>`
          : `<span class="promo-badge promo-badge-publica">Pública</span>`;

        return `
          <div class="promo-card" id="promo-${p.id}">
            <div class="promo-card-header">
              <span class="promo-titulo">${p.titulo || "Promoção VIP"}</span>
              ${accessBadge}
            </div>

            <div class="promo-info-row">
              <div class="promo-info-item">
                <span class="promo-info-label">Vagas</span>
                <span class="promo-info-value">${vagas}</span>
              </div>
              <div class="promo-info-item">
                <span class="promo-info-label">Limite</span>
                <span class="promo-info-value">${limite}x por usuário</span>
              </div>
              <div class="promo-info-item">
                <span class="promo-info-label">Encerra em</span>
                <span class="promo-info-value">${dataFim}</span>
              </div>
            </div>

            <button
              class="btn-participar"
              id="btn-part-${p.id}"
              onclick="participar('${p.id}', this)"
            >Participar</button>

            <p class="promo-feedback" id="feedback-${p.id}"></p>
          </div>`;
      }).join("");
    }

    // ── Carrega e exibe promoções disponíveis ────────────────────────────────
    async function loadPromos(uid, vipData) {
      const card = document.getElementById("promos-card");
      card.style.display = "flex";

      const isVipAtivo = vipData?.vip5Active === true
        && (!vipData.vip5ExpiresAt || vipData.vip5ExpiresAt > Date.now());

      console.log("[VIP5-USUARIO] Carregando promoções. isVip:", isVipAtivo);
      const result = await fetchVisiblePromotions({ isVip: isVipAtivo, limit: 10 });

      if (!result.success || result.data.items.length === 0) {
        document.getElementById("promos-list").innerHTML =
          `<p class="promos-empty">Nenhuma promoção disponível no momento.</p>`;
        return;
      }

      renderPromos(result.data.items, uid, vipData);

      // Verifica elegibilidade de cada promoção em paralelo
      await Promise.all(result.data.items.map(async (p) => {
        const check = await canParticipate(p.id, uid, vipData);
        const btn   = document.getElementById(`btn-part-${p.id}`);
        const fb    = document.getElementById(`feedback-${p.id}`);
        if (!btn) return;
        if (check.success && !check.data.canParticipate) {
          btn.disabled      = true;
          btn.textContent   = "Indisponível";
          fb.className      = "promo-feedback err";
          fb.textContent    = check.data.reason || "";
        }
      }));
    }

    // ── Handler de participação ───────────────────────────────────────────────
    window.participar = async function (promoId, btn) {
      if (!_currentUser) return;
      const fb = document.getElementById(`feedback-${promoId}`);

      btn.disabled    = true;
      btn.textContent = "Participando...";
      if (fb) { fb.className = "promo-feedback"; fb.textContent = ""; }

      const result = await registerParticipation(promoId, _currentUser.uid);

      if (result.success) {
        btn.textContent = "✓ Participando!";
        if (fb) { fb.className = "promo-feedback ok"; fb.textContent = "Participação confirmada!"; }
        console.log("[VIP5-USUARIO] Participação registrada:", promoId);
      } else {
        btn.disabled    = false;
        btn.textContent = "Participar";
        if (fb) { fb.className = "promo-feedback err"; fb.textContent = result.error || "Tente novamente."; }
        console.error("[VIP5-USUARIO] Erro na participação:", result.error);
      }
    };

    // ── Inicialização ─────────────────────────────────────────────────────────
    try {
      const { user, vipData } = await checkVipExpiration("vip5.html");

      _currentUser = user;
      _currentVip  = vipData;

      console.log("[VIP5-USUARIO] Acesso VIP válido. uid=" + user.uid);
      console.log("[VIP5-USUARIO] Dados VIP:", vipData);

      document.getElementById("uid-value").textContent       = user.uid;
      document.getElementById("code-value").textContent      = vipData.vip5Code || "—";
      document.getElementById("activated-value").textContent = formatDate(vipData.vip5ActivatedAt);
      document.getElementById("expires-value").textContent   = formatDate(vipData.vip5ExpiresAt);

      document.getElementById("loading").style.display = "none";
      document.getElementById("content").style.display = "flex";

      startCountdown(vipData.vip5ExpiresAt, vipData.vip5ActivatedAt);

      // Carrega promoções sem bloquear a exibição do conteúdo VIP
      loadPromos(user.uid, vipData).catch((err) => {
        console.error("[VIP5-USUARIO] Erro ao carregar promoções:", err.message, err);
      });

      document.getElementById("btn-logout").addEventListener("click", async () => {
        console.log("[VIP5-USUARIO] Fazendo logout...");
        if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
        try {
          await signOut(auth);
          console.log("[VIP5-USUARIO] Logout realizado. Redirecionando para vip5.html");
          window.location.href = "vip5.html";
        } catch (err) {
          console.error("[VIP5-USUARIO] Erro no logout:", err.code, err.message, err);
          showError("Erro ao sair: " + err.message);
        }
      });

    } catch (err) {
      console.error("[VIP5-USUARIO] Erro ao verificar VIP:", err.code, err.message, err);
      showError("Erro ao verificar acesso VIP: " + (err.message || "Tente novamente."));
    }
  </script>

</body>
</html>
