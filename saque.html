<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Saque</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<!-- Sistema de Autenticação Centralizado -->
<script src="sistema-auth.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  visibility: hidden;
}

.container {
  max-width: 500px;
  width: 100%;
  text-align: center;
  padding: 25px;
}

.card {
  background: rgba(255, 255, 255, 0.1);
  padding: 25px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
}

h2 {
  font-size: 32px;
  margin-bottom: 20px;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
}

p {
  font-size: 14px;
  margin-top: 15px;
  opacity: 0.9;
}

button, input, select {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border-radius: 12px;
  border: none;
  text-align: center;
  font-size: 16px;
  transition: all 0.3s ease;
}

button {
  background: #39c6ff;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #1ab0f0;
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(57, 198, 255, 0.4);
}

button:active {
  transform: translateY(0);
  box-shadow: 0 4px 10px rgba(57, 198, 255, 0.4);
}

input, select {
  background: rgba(255, 255, 255, 0.15);
  color: white;
  border: 1px solid rgba(255, 255, 255, 0.3);
  font-weight: 500;
}

input::placeholder {
  color: rgba(255, 255, 255, 0.7);
}

input:focus, select:focus {
  outline: none;
  background: rgba(255, 255, 255, 0.25);
  border-color: rgba(255, 255, 255, 0.5);
  box-shadow: 0 0 10px rgba(57, 198, 255, 0.3);
}

select option {
  background: #764ba2;
  color: white;
}

#saldo {
  font-size: 32px;
  font-weight: bold;
  margin: 20px 0;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
  animation: pulse 0.5s ease in-out;
}

@keyframes pulse {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.05);
  }
  100% {
    transform: scale(1);
  }
}

.saldo-label {
  font-size: 14px;
  opacity: 0.9;
  margin-bottom: 5px;
}

@media (max-width: 600px) {
  .container {
    padding: 15px;
  }

  .card {
    padding: 20px;
  }

  h2 {
    font-size: 24px;
  }

  button, input, select {
    padding: 12px;
    font-size: 14px;
  }

  #saldo {
    font-size: 24px;
  }
}
</style>
</head>

<body>

<div class="container">
  <h2>💸 SAQUE</h2>

  <div class="card">

    <div class="saldo-label">Saldo disponível</div>
    <div id="saldo">R$ 0,00</div>

    <input type="number" id="valor" placeholder="Digite o valor do saque" oninput="calcularTaxaSaque()">

    <div id="resumoSaque" style="display: none; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 12px; margin-top: 15px; border: 1px solid rgba(255,255,255,0.3);">
      <div style="font-size: 14px; margin-bottom: 10px; opacity: 0.9;">
        <div style="margin-bottom: 12px;">
          <span>Valor solicitado:</span>
          <span id="valorSolicitado" style="float: right; font-weight: bold;">R$ 0,00</span>
          <br style="clear: both;">
        </div>
        <div style="margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 12px;">
          <span>Taxa (6%):</span>
          <span id="taxaSaque" style="float: right; font-weight: bold; color: #ff6b6b;">R$ 0,00</span>
          <br style="clear: both;">
        </div>
        <div style="font-size: 16px; font-weight: bold;">
          <span>Valor líquido:</span>
          <span id="valorLiquido" style="float: right; color: #39c6ff;">R$ 0,00</span>
          <br style="clear: both;">
        </div>
      </div>
    </div>

    <select id="tipoPix">
      <option value="">Tipo de chave Pix</option>
      <option value="cpf">CPF</option>
      <option value="email">E-mail</option>
      <option value="telefone">Telefone</option>
      <option value="aleatoria">Aleatória</option>
    </select>

    <input type="text" id="chave" placeholder="Informe a chave Pix">

    <button onclick="solicitarSaque()">
      Solicitar Saque
    </button>

    <p>
      Seu saque será processado em até 24 horas
    </p>

  </div>
</div>

<script>

// Usando sistema-auth.js: auth e db já configurados (compat Firebase)

let uid = null;
let saldoAtual = 0;

const formatador = new Intl.NumberFormat(
  "pt-BR",
  {
    style: "currency",
    currency: "BRL"
  }
);

// =============================
// ESCUTAR DEPÓSITOS APROVADOS
// =============================

function escutarDepositosAprovados(){

  // Query simplificada - remover creditado != true para evitar erro de índice
  window.SistemaAuth.db.collection("depositos")
    .where("uid","==",uid)
    .where("status","==","aprovado")
    .get()
    .then(snapshot => {

      snapshot.forEach(async change => {

        const deposito = change.data();
        
        // Verificar se já foi creditado
        if(deposito.creditado === true) {
          return; // Já foi creditado, pular
        }

        const depositoRef = change.ref;
        const userRef = window.SistemaAuth.db.collection("users").doc(uid);

        try {

          await window.SistemaAuth.db.runTransaction(async t => {

            const userDoc = await t.get(userRef);

            const saldoBanco = userDoc.data().saldo || 0;
            const novoSaldo = saldoBanco + deposito.valor;

            t.update(userRef, {
              saldo: novoSaldo
            });

            t.update(depositoRef, {
              creditado: true
            });

            saldoAtual = novoSaldo;

          });

          document.getElementById("saldo")
            .innerText = formatador.format(saldoAtual);

          console.log("✅ Saldo atualizado automaticamente: R$ " + formatador.format(saldoAtual));

        } catch(error) {
          console.error("❌ Erro ao atualizar saldo:", error);
        }

      });

    })
    .catch(error => {
      console.error("Erro ao escutar depósitos:", error);
    });

  // Recarregar a cada 5 segundos como fallback
  setInterval(() => {
    atualizarSaldoManualmente();
  }, 5000);

}

// Atualizar saldo manualmente como fallback
async function atualizarSaldoManualmente() {

  try {
    const docUser = await window.SistemaAuth.db.collection("users").doc(uid).get();
    
    if (docUser.exists) {
      const novoSaldo = docUser.data().saldo || 0;
      
      if(novoSaldo !== saldoAtual) {
        saldoAtual = novoSaldo;
        document.getElementById("saldo")
          .innerText = formatador.format(saldoAtual);
        
        console.log("✅ Saldo atualizado (manual): R$ " + formatador.format(saldoAtual));
      }
    }
  } catch(error) {
    console.error("Erro ao atualizar saldo manualmente:", error);
  }

}

// 🔐 Proteção de acesso e dados do saque
document.addEventListener('DOMContentLoaded', function() {
  console.log('🔐 Verificando autenticação no saque...');

  // Usar sistema centralizado para verificar login
  window.SistemaAuth.verificarLogin((autenticado, dadosUsuario) => {
    if (!autenticado) {
      console.log('❌ Usuário não autenticado, redirecionando para login...');
      window.location.href = 'login.html';
      return;
    }

    console.log('✅ Usuário autenticado, carregando dados do saque...');

    // Inicializar variáveis globais
    uid = dadosUsuario.uid;
    saldoAtual = dadosUsuario.saldo || 0;

    // Carregar saldo
    window.SistemaAuth.carregarSaldo('saldo');

    // Tornar body visível
    document.body.style.visibility = "visible";

    // Escutar depósitos aprovados
    escutarDepositosAprovados();
  });
});

// ===== CALC AUTOMÁTICO DE TAXA =====

function calcularTaxaSaque(){

  const valorInput = Number(document.getElementById("valor").value);
  const resumoDiv = document.getElementById("resumoSaque");
  
  if(!valorInput || valorInput <= 0) {
    resumoDiv.style.display = "none";
    return;
  }
  
  // Cálculo da taxa: 6%
  const taxaPercentual = 0.06;
  const taxa = valorInput * taxaPercentual;
  const valorLiquido = valorInput - taxa;
  
  // Exibir no resumo
  document.getElementById("valorSolicitado").innerText = formatador.format(valorInput);
  document.getElementById("taxaSaque").innerText = formatador.format(taxa);
  document.getElementById("valorLiquido").innerText = formatador.format(valorLiquido);
  
  resumoDiv.style.display = "block";
}

// SOLICITAR SAQUE

async function solicitarSaque(){

  const valorSolicitado = Number(document.getElementById("valor").value);
  const tipo = document.getElementById("tipoPix").value;
  const chave = document.getElementById("chave").value.trim();
  
  const VALOR_MINIMO = 10; // Mínimo permitido
  const TAXA_PERCENTUAL = 0.06; // 6%
  
  // Validações
  if(!valorSolicitado)
    return alert("❌ Informe um valor para o saque");
  
  if(valorSolicitado < VALOR_MINIMO)
    return alert(`❌ O valor mínimo permitido é R$ ${formatador.format(VALOR_MINIMO)}`);
  
  if(valorSolicitado > saldoAtual)
    return alert("❌ Saldo insuficiente");
  
  if(!tipo)
    return alert("❌ Selecione o tipo de chave Pix");
  
  if(!chave)
    return alert("❌ Informe a chave Pix");
  
  // Calcular taxa e valor líquido
  const taxaSaque = valorSolicitado * TAXA_PERCENTUAL;
  const valorLiquido = valorSolicitado - taxaSaque;
  
  // Confirmar com o usuário
  const confirmacao = confirm(
    `📋 Confirme sua solicitação de saque:\n\n` +
    `Valor solicitado: ${formatador.format(valorSolicitado)}\n` +
    `Taxa (6%): ${formatador.format(taxaSaque)}\n` +
    `Valor que você receberá: ${formatador.format(valorLiquido)}\n\n` +
    `Deseja continuar?`
  );
  
  if(!confirmacao) return;
  
  try {
    // Salvar saque no Firestore com todos os campos
    await window.SistemaAuth.db.collection("saques").add({
      uid: uid,
      valorSolicitado: valorSolicitado,
      taxaSaque: taxaSaque,
      valorLiquido: valorLiquido,
      tipoPix: tipo,
      chave: chave,
      status: "pendente",
      dataSaque: window.SistemaAuth.firebase.firestore.FieldValue.serverTimestamp()
    });
    
    // Atualizar saldo do usuário (deduzir valor solicitado completo)
    await window.SistemaAuth.db
      .collection("users")
      .doc(uid)
      .update({
        saldo: saldoAtual - valorSolicitado
      });
    
    saldoAtual -= valorSolicitado;
    
    // Atualizar display
    document.getElementById("saldo").innerText = formatador.format(saldoAtual);
    document.getElementById("valor").value = "";
    document.getElementById("chave").value = "";
    document.getElementById("tipoPix").value = "";
    document.getElementById("resumoSaque").style.display = "none";
    
    alert("✅ Saque solicitado com sucesso!\n\nSeu saque será processado em até 24 horas.");
    
  } catch(error) {
    console.error("❌ Erro ao solicitar saque:", error);
    alert("❌ Erro ao solicitar saque. Tente novamente.");
  }

}

</script>

</body>
</html>
