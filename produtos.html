<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>📦 Produtos Magaxia</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<!-- Sistema de Autenticação Centralizado -->
<script src="sistema-auth.js"></script>

<style>
/* RESET E BASE */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  padding: 20px;
  color: #333;
}

/* CABEÇALHO */
h1{
  text-align: center;
  color: white;
  font-size: 2.5rem;
  margin-bottom: 20px;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  position: relative;
}

#saldo{
  position: fixed;
  top: 20px;
  right: 20px;
  background: rgba(255,255,255,0.95);
  padding: 15px 25px;
  border-radius: 50px;
  font-weight: bold;
  font-size: 1.1rem;
  display: block;
  box-shadow: 0 8px 25px rgba(0,0,0,0.2);
  z-index: 1000;
  backdrop-filter: blur(10px);
}

/* SALDO TOTAL NO LADO DIREITO */
#saldo-total-display{
  position: fixed;
  top: 20px;
  right: 20px;
  background: white;
  padding: 15px 25px;
  border-radius: 50px;
  font-weight: bold;
  font-size: 1.1rem;
  box-shadow: 0 8px 25px rgba(0,0,0,0.2);
  z-index: 1000;
  color: black;
  border: 1px solid #ddd;
}

#saldo-total-display #saldoTotal {
  color: #4CAF50;
  font-size: 1.2rem;
}

/* RESPONSIVO PARA CELULAR */
@media (max-width: 768px) {
  #saldo-total-display {
    top: 10px;
    right: 10px;
    padding: 10px 15px;
    font-size: 1rem;
  }
}

/* BOTÃO VOLTAR */
.back-button{
  position:fixed;
  top:20px;
  left:20px;
  width:50px;
  height:50px;
  background:linear-gradient(135deg, #39c6ff, #b84cff);
  border:none;
  border-radius:50%;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  transition:all 0.3s ease;
  box-shadow:0 8px 25px rgba(57,198,255,0.3);
  z-index:100;
}

.back-button:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 35px rgba(57,198,255,0.4);
}

/* PAINEL ADMIN */
.admin-panel{
  background: rgba(255,255,255,0.95);
  padding: 25px;
  border-radius: 15px;
  margin-bottom: 30px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  backdrop-filter: blur(10px);
  display: none; /* Inicialmente oculto */
}

.admin-panel h3{
  color: #667eea;
  margin-bottom: 20px;
  font-size: 1.5rem;
}

.admin-form{
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  margin-bottom: 20px;
  align-items: center;
}

.admin-form input{
  padding: 12px;
  border: 2px solid #ddd;
  border-radius: 8px;
  font-size: 14px;
  min-width: 200px;
  transition: border-color 0.3s;
}

.admin-form input:focus{
  outline: none;
  border-color: #667eea;
}

.btn-admin{
  padding: 12px 20px;
  background: linear-gradient(135deg, #4CAF50, #45a049);
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  transition: all 0.3s;
}

.btn-admin:hover{
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(76,175,80,0.4);
}

/* PRODUTOS GRID */
.produtos{
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 25px;
  margin-top: 30px;
}

/* CARDS DE PRODUTO */
.card{
  background: rgba(255,255,255,0.95);
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  transition: all 0.3s ease;
  backdrop-filter: blur(10px);
  position: relative;
}

.card:hover{
  transform: translateY(-10px);
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
}

.produto-img{
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-bottom: 3px solid #667eea;
}

.chip{
  position: absolute;
  top: 15px;
  left: 15px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  padding: 8px 15px;
  border-radius: 20px;
  font-weight: bold;
  font-size: 0.9rem;
  box-shadow: 0 4px 15px rgba(102,126,234,0.3);
}

.valor{
  font-size: 1.8rem;
  font-weight: bold;
  color: #333;
  text-align: center;
  margin: 15px 0;
  color: #4CAF50;
}

.info{
  padding: 0 20px;
  margin-bottom: 10px;
  font-size: 0.95rem;
  color: #666;
}

.destaque{
  color: #667eea;
  font-weight: bold;
  font-size: 1.1rem;
}

/* BOTÃO COMPRAR */
button{
  width: 100%;
  padding: 15px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  border: none;
  border-radius: 0 0 15px 15px;
  font-size: 1rem;
  font-weight:600;
  cursor: pointer;
  transition: all 0.3s ease;
  position:relative;
  overflow:hidden;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 5px 15px rgba(102,126,234,0.4);
}

button:active{
  transform:translateY(0);
}

/* LISTA ADMIN DE PRODUTOS */
.admin-lista{
  margin-top: 30px;
}

.produto-admin{
  background: rgba(255,255,255,0.95);
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 15px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  backdrop-filter: blur(10px);
}

.produto-admin b{
  color: #333;
  font-size: 1.1rem;
}

.status-badge{
  padding: 4px 8px;
  border-radius: 12px;
  font-size: 0.8rem;
  font-weight: bold;
  margin-left: 10px;
}

.status-ativo{
  background: #e8f5e9;
  color: #2e7d32;
}

.status-inativo{
  background: #ffebee;
  color: #c62828;
}

.admin-info{
  margin: 8px 0;
  color: #666;
  font-size: 0.9rem;
}

.admin-actions{
  margin-top: 15px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.btn-editar{
  background: linear-gradient(135deg, #1976d2, #115293);
  color: white;
  border: none;
  padding: 8px 15px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: all 0.3s;
}

.btn-editar:hover{
  transform: translateY(-2px);
  box-shadow: 0 3px 10px rgba(25,118,210,0.3);
}

.btn-desativar{
  background: linear-gradient(135deg, #ff9800, #e68900);
  color: white;
  border: none;
  padding: 8px 15px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: all 0.3s;
}

.btn-desativar:hover{
  transform: translateY(-2px);
  box-shadow: 0 3px 10px rgba(255,152,0,0.3);
}

.btn-excluir{
  background: linear-gradient(135deg, #ff5252, #ff1744);
  color: white;
  border: none;
  padding: 8px 15px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: all 0.3s;
}

.btn-excluir:hover{
  transform: translateY(-2px);
  box-shadow: 0 3px 10px rgba(255,82,82,0.3);
}

/* MENSAGENS */
.sucesso{
  background: #e8f5e9;
  color: #2e7d32;
  padding: 15px;
  border-radius: 8px;
  margin-bottom: 20px;
  display: none;
  font-weight: bold;
}

.erro{
  background: #ffebee;
  color: #c62828;
  padding: 15px;
  border-radius: 8px;
  margin-bottom: 20px;
  display: none;
  font-weight: bold;
}

/* RESPONSIVO */
@media (max-width: 768px){
  .admin-form{
    flex-direction: column;
  }

  .admin-form input{
    min-width: 100%;
  }

  .produtos{
    grid-template-columns: 1fr;
  }

  h1{
    font-size: 2rem;
  }

  #saldo{
    position: static;
    margin-bottom: 20px;
    text-align: center;
  }

  .back-button{
    top: 80px;
  }
}

/* ABAS */
.abas {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
  justify-content: center;
  flex-wrap: wrap;
  padding: 12px;
  background: linear-gradient(135deg, rgba(29, 33, 69, 0.95), rgba(65, 87, 165, 0.95));
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 18px;
  box-shadow: 0 14px 40px rgba(12, 24, 80, 0.20);
}

.abas button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: auto;
  padding: 10px 18px;
  border: none;
  background: #111;
  color: white;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 700;
  transition: all 0.25s ease;
}

.abas button:hover {
  background: #333;
}

.abas button.active {
  background: linear-gradient(135deg, #667eea, #764ba2);
}

.aba {
  display: none;
}

.aba.ativa {
  display: grid;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  z-index: 1000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.5);
}

.modal-content {
  background: white;
  margin: 10% auto;
  padding: 20px;
  border-radius: 10px;
  width: 90%;
  max-width: 500px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.close {
  float: right;
  font-size: 28px;
  cursor: pointer;
  color: #aaa;
}

.close:hover {
  color: #000;
}

#editForm {
  display: flex;
  flex-direction: column;
  gap: 15px;
  margin-top: 20px;
}

#editForm input, #editForm select {
  padding: 12px;
  border: 2px solid #ddd;
  border-radius: 8px;
  font-size: 14px;
}

#editForm button {
  align-self: flex-start;
}
</style>
</head>

<body>

<button class="back-button" onclick="window.location.href='painel.html'">←</button>

<h1>📦 Produtos Magaxia</h1>

<div id="saldo">Saldo: Carregando...</div>

<p id="saldo-total-display">Saldo Total: R$ <span id="saldoTotal">0.00</span></p>

<!-- PAINEL ADMIN (VISÍVEL APENAS PARA ADMINS) -->
<div class="admin-panel" id="adminPanel">
  <h3>🎛️ Painel Administrativo</h3>

  <div class="admin-form">
    <input id="nome" placeholder="Nome do Produto" type="text">
    <input id="preco" placeholder="Preço (R$)" type="number" min="0" step="0.01">
    <input id="renda" placeholder="Renda Diária (R$)" type="number" min="0" step="0.01">
    <input id="ciclo" placeholder="Ciclo (dias)" type="number" min="1" step="1">
    <label for="tipo" style="width:100%; font-weight:600; color:#333;">Escolher aba do produto:</label>
    <select id="tipo" required>
      <option value="">Selecione a aba</option>
      <option value="eventos">Eventos</option>
      <option value="vip">VIP</option>
      <option value="diario">Diário</option>
      <option value="fixo">Fixo</option>
    </select>
    <div id="previewTipo" style="margin-top: 10px; font-weight: bold; color: #667eea;"></div>
    <input id="imagem" placeholder="URL da Imagem (opcional)" type="url">
    <button class="btn-admin" onclick="adicionarProduto()">➕ Adicionar Produto</button>
  </div>

  <div class="sucesso" id="mensagemSucesso"></div>
  <div class="erro" id="mensagemErro"></div>

  <h3>� Métricas</h3>
  <div id="metricas"></div>

  <h3>📋 Gerenciar Produtos</h3>
  <div class="admin-lista" id="adminLista"></div>
</div>

<!-- MODAL DE EDIÇÃO -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="fecharModal()">&times;</span>
    <h3>Editar Produto</h3>
    <form id="editForm">
      <input id="editNome" placeholder="Nome" type="text" required>
      <input id="editPreco" placeholder="Preço" type="number" min="0" step="0.01" required>
      <input id="editRenda" placeholder="Renda Diária" type="number" min="0" step="0.01" required>
      <input id="editCiclo" placeholder="Ciclo" type="number" min="1" step="1" required>
      <select id="editTipo" required>
        <option value="eventos">Eventos</option>
        <option value="vip">VIP</option>
        <option value="diario">Diário</option>
        <option value="fixo">Fixo</option>
      </select>
      <div id="editPreviewTipo" style="margin-top: 10px; font-weight: bold; color: #667eea;"></div>
      <input id="editImagem" placeholder="URL da Imagem" type="url">
      <button type="submit" class="btn-admin">Salvar</button>
    </form>
  </div>
</div>

<!-- ABAS DE PRODUTOS -->
<div class="abas">
  <button class="active" onclick="trocarAba('eventos')">🎉 Eventos</button>
  <button onclick="trocarAba('vip')">👑 VIP</button>
  <button onclick="trocarAba('diario')">📅 Diário</button>
  <button onclick="trocarAba('fixo')">🔒 Fixo</button>
</div>

<!-- CATÁLOGO DE PRODUTOS PARA USUÁRIOS -->
<div id="produtosEventos" class="produtos aba" style="display: block;"></div>
<div id="produtosVip" class="produtos aba" style="display: none;"></div>
<div id="produtosDiario" class="produtos aba" style="display: none;"></div>
<div id="produtosFixo" class="produtos aba" style="display: none;"></div>

<script>
// 🔐 CONFIGURAÇÃO DE ADMINISTRADORES
const ADMINS = ["admin@magaxia.com", "adm@magaxia.com"]; // Adicione emails de admin aqui

// 🔐 VARIÁVEIS GLOBAIS
let uid = null;
let saldoAtual = 0;
let saldoSaque = 0;
let saldoDeposito = 0;
let usuarioAtual = null;
let isAdmin = false;
let usuarioVipNivel = 0; // Nível VIP do usuário (0-5)

const formatador = new Intl.NumberFormat(
    "pt-BR",
    {
        style: "currency",
        currency: "BRL"
    }
);

// 🔐 VERIFICAÇÃO DE AUTENTICAÇÃO E PERMISSÕES
document.addEventListener('DOMContentLoaded', function() {
  console.log('🔐 Verificando autenticação nos produtos...');

  // Verificar autenticação diretamente com Firebase
  firebase.auth().onAuthStateChanged(user => {
    if (!user) {
      console.log('❌ Usuário não autenticado, redirecionando para login...');
      window.location.href = 'login.html';
      return;
    }

    console.log('✅ Usuário autenticado, carregando interface...');

    // Dados do usuário
    const dadosUsuario = {
      uid: user.uid,
      email: user.email,
      telefone: user.phoneNumber || ''
    };

    // Inicializar variáveis globais
    uid = dadosUsuario.uid;
    usuarioAtual = dadosUsuario;

    // Verificar se é admin
    isAdmin = ADMINS.includes(dadosUsuario.email?.toLowerCase());
    console.log('👤 Usuário:', dadosUsuario.email, 'Admin:', isAdmin);

    // Mostrar/ocultar painel admin
    if (isAdmin) {
      document.getElementById('adminPanel').style.display = 'block';
      carregarListaAdmin(); // Carregar lista de gerenciamento
    }

    // Carregar nível VIP do usuário
    carregarNivelVIP();

    // Inicializar saldos
    carregarSaldoTotal();
    carregarProdutos();

    // Tornar body visível
    document.body.style.visibility = "visible";
  });
});

// � CARREGAR NÍVEL VIP DO USUÁRIO
function carregarNivelVIP() {
  if (!uid) {
    console.warn("⚠️ UID não definido ao tentar carregar VIP");
    usuarioVipNivel = 0;
    return;
  }

  window.SistemaAuth.db
    .collection("users")
    .doc(uid)
    .onSnapshot(doc => {
      if (!doc.exists) {
        console.warn("⚠️ Documento do usuário não encontrado, definindo VIP nível 0");
        usuarioVipNivel = 0;
        return;
      }

      const data = doc.data();
      usuarioVipNivel = Number(data.vipNivel || 0);
      console.log("👑 Nível VIP do usuário atualizado:", usuarioVipNivel);
    }, error => {
      console.error("❌ Erro ao carregar VIP:", error);
      usuarioVipNivel = 0;
    });
}

// �💰 CARREGAR SALDO TOTAL
function carregarSaldoTotal() {
  if (!uid) {
    console.error("UID inválido:", uid);
    return;
  }

  window.SistemaAuth.db
    .collection("users")
    .doc(uid)
    .onSnapshot(doc => {
      if (!doc.exists) {
        console.error("Usuário não encontrado");
        return;
      }

      const data = doc.data();

      const saldoSaque =
        Number(data.saldoSaque || 0);

      const saldoDeposito =
        Number(data.saldoDeposito || 0);

      const saldoTotal =
        saldoSaque + saldoDeposito;

      console.log("UID:", uid);
      console.log("Deposito:", saldoDeposito);
      console.log("Saque:", saldoSaque);
      console.log("Total:", saldoTotal);

      document.getElementById("saldo").style.display = "block";

      document.getElementById("saldo").textContent =
        `Saldo: R$ ${saldoTotal.toFixed(2)}`;

      document.getElementById("saldoTotal").textContent =
        saldoTotal.toFixed(2);
    });
}

// 🎯 EXTRAIR NÍVEL VIP DO NOME DO PRODUTO
function getVipProduto(nome) {
  const match = nome.toLowerCase().match(/vip(\d+)/);
  const nivel = match ? parseInt(match[1]) : 0;
  console.log("🎯 Produto:", nome, "| VIP necessário:", nivel);
  return nivel;
}

// 🚫 VERIFICAR SE PRODUTO VIP JÁ FOI COMPRADO
async function verificarJaComprou(produtoId) {
  try {
    const jaComprou = await window.SistemaAuth.db
      .collection("compras")
      .where("userId", "==", uid)
      .where("produtoId", "==", produtoId)
      .get();

    return !jaComprou.empty;
  } catch (err) {
    console.error("Erro ao verificar compra anterior:", err);
    return false;
  }
}

// 💰 COMPRAR PRODUTO
async function comprarProduto(id, nome, preco, renda, ciclo, tipo){
  try {
    // 👑 VERIFICAR RESTRIÇÃO VIP
    const vipNecessario = getVipProduto(nome);
    console.log("👤 Usuário VIP:", usuarioVipNivel, "| Necessário:", vipNecessario);

    if (vipNecessario > 0 && usuarioVipNivel < vipNecessario) {
      alert(`❌ Este produto é VIP${vipNecessario}.\nSeu nível atual é VIP${usuarioVipNivel}.\nVocê não possui acesso a este produto.`);
      return;
    }

    // 🚫 VERIFICAR COMPRA ANTERIOR PARA PRODUTOS VIP
    if (tipo === 'vip') {
      console.log("🔍 Verificando compra VIP anterior...");
      const jaComprou = await window.SistemaAuth.db
        .collection("compras")
        .where("userId", "==", uid)
        .where("produtoId", "==", id)
        .get();

      console.log("✓ Já comprou:", !jaComprou.empty);

      if (!jaComprou.empty) {
        alert("❌ Você já comprou este produto VIP.\nCada produto VIP pode ser comprado apenas uma vez.");
        return;
      }
    }

    // Verificar se usuário está autenticado
    if (!firebase.auth().currentUser) {
      alert("Você precisa estar logado para comprar!");
      window.location.href = 'login.html';
      return;
    }

    // Verificar variáveis globais
    if (!uid) {
      alert("Erro: UID do usuário não disponível!");
      return;
    }

    // Ler saldos do Firestore para garantir valores atualizados
    const userDoc = await window.SistemaAuth.db.collection("users").doc(uid).get();
    const usuario = userDoc.data();

    const saldoDeposito = Number(usuario.saldoDeposito || 0);
    const saldoSaque = Number(usuario.saldoSaque || 0);
    const saldoTotal = saldoDeposito + saldoSaque;

    // Logs obrigatórios
    console.log("Saldo Deposito:", saldoDeposito);
    console.log("Saldo Saque:", saldoSaque);
    console.log("Saldo Total:", saldoTotal);
    console.log("Preço Produto:", preco);

    // Validar compra usando saldo total
    if (saldoTotal < preco) {
      alert("Saldo insuficiente para comprar este produto.");
      return;
    }

    if(!confirm(`Deseja comprar "${nome}" por R$ ${preco.toFixed(2)}?\nSaldo atual: R$ ${saldoTotal.toFixed(2)}`)){
      return;
    }

    await window.SistemaAuth.db.runTransaction(async t => {
      const userRef = window.SistemaAuth.db.collection("users").doc(uid);
      const userDoc = await t.get(userRef);

      // Se documento não existe, criar com saldos zerados
      if (!userDoc.exists) {
        console.log("Documento não existe, criando...");
        t.set(userRef, {
          saldoDeposito: 0,
          saldoSaque: 0,
          email: firebase.auth().currentUser.email,
          uid: uid,
          dataCriacao: window.SistemaAuth.firebase.firestore.FieldValue.serverTimestamp()
        });
        throw new Error("Documento do usuário foi criado. Por favor, tente a compra novamente.");
      }

      // Ler corretamente os campos do Firestore
      const saldoSaqueBanco = Number(userDoc.data().saldoSaque || 0);
      const saldoDepositoBanco = Number(userDoc.data().saldoDeposito || 0);
      const saldoTotalBanco = saldoSaqueBanco + saldoDepositoBanco;

      // Logs adicionais do banco
      console.log("Valores do Banco - saldoSaque:", saldoSaqueBanco, "saldoDeposito:", saldoDepositoBanco, "Total:", saldoTotalBanco);

      // Validação final com valores do banco
      if(preco > saldoTotalBanco) throw new Error("Saldo insuficiente");

      // CORREÇÃO: Aplicar prioridade correta - primeiro saldoDeposito, depois saldoSaque
      let novoSaldoDeposito = saldoDepositoBanco;
      let novoSaldoSaque = saldoSaqueBanco;

      if (saldoDepositoBanco >= preco) {
        // 1. Consumir primeiro do saldoDeposito
        novoSaldoDeposito = saldoDepositoBanco - preco;
      } else {
        // 2. Se saldoDeposito não for suficiente, usar todo ele e descontar o restante de saldoSaque
        const restante = preco - saldoDepositoBanco;
        novoSaldoDeposito = 0;
        novoSaldoSaque = saldoSaqueBanco - restante;
      }

      // Garantir que nenhum saldo fique negativo
      if (novoSaldoSaque < 0) novoSaldoSaque = 0;
      if (novoSaldoDeposito < 0) novoSaldoDeposito = 0;

      console.log("Saldos após desconto - saldoSaque:", novoSaldoSaque, "saldoDeposito:", novoSaldoDeposito);

      // Atualizar CORRETAMENTE no Firestore
      t.update(userRef, {
        saldoSaque: novoSaldoSaque,
        saldoDeposito: novoSaldoDeposito
      });

      // Registrar a compra com informações completas
      t.set(window.SistemaAuth.db.collection("compras").doc(), {
        userId: uid,
        produtoId: id,
        nome: nome,
        tipo: tipo,
        valor: preco,
        rendaDiaria: renda,
        ciclo: ciclo,
        status: "ativo",
        data: window.SistemaAuth.firebase.firestore.FieldValue.serverTimestamp()
      });
    });

    const dataCompraISO = new Date().toISOString();
    localStorage.setItem('ultimaCompraData', dataCompraISO);
    alert(`✅ Produto "${nome}" comprado com sucesso!`);
    // O saldo será atualizado automaticamente pelo listener
  } catch(e) {
    alert("❌ Erro ao comprar produto: " + e.message);
    console.error("Erro na compra:", e);
  }
}

// 📦 CARREGAR PRODUTOS PARA USUÁRIOS
function carregarProdutos(){
  console.log("🔄 Iniciando carregamento de produtos...");
  const eventos = document.getElementById('produtosEventos');
  const vip = document.getElementById('produtosVip');
  const diario = document.getElementById('produtosDiario');
  const fixo = document.getElementById('produtosFixo');

  eventos.innerHTML = "";
  vip.innerHTML = "";
  diario.innerHTML = "";
  fixo.innerHTML = "";

  window.SistemaAuth.db.collection("produtos")
    .where("ativo", "==", true)
    .onSnapshot(async (snapshot) => {
      console.log("📦 Snapshot recebida, documentos:", snapshot.size);

      if(snapshot.empty) {
        console.log("📦 Nenhum produto encontrado, criando produtos de exemplo...");
        await criarProdutosExemplo();
        return;
      }

      const produtosOrdenados = snapshot.docs
        .map((doc) => ({ id: doc.id, data: doc.data() }))
        .sort((a, b) => {
          const aTs = a.data.criadoEm ? (typeof a.data.criadoEm.toMillis === 'function' ? a.data.criadoEm.toMillis() : new Date(a.data.criadoEm).getTime()) : 0;
          const bTs = b.data.criadoEm ? (typeof b.data.criadoEm.toMillis === 'function' ? b.data.criadoEm.toMillis() : new Date(b.data.criadoEm).getTime()) : 0;
          return aTs - bTs;
        });

      for (const produto of produtosOrdenados) {
        const docId = produto.id;
        const p = produto.data;
        const tipo = p.tipo || "eventos";
        console.log("Produto:", p.nome, "Tipo:", tipo);

        // 👑 VERIFICAR RESTRIÇÃO VIP
        const vipNecessario = getVipProduto(p.nome);
        console.log("  - VIP necessário:", vipNecessario, "| Usuário VIP:", usuarioVipNivel);

        // 🚫 BLOQUEAR VISUALIZAÇÃO DE PRODUTOS VIP INDISPONÍVEIS
        if (vipNecessario > 0 && usuarioVipNivel < vipNecessario) {
          console.log("  ❌ Produto oculto (insuficiente VIP)");
          return; // Não mostrar este produto
        }

        const card = document.createElement('div');
        card.className = 'card';

        // Verificar se produto VIP já foi comprado
        let classeBot = '';
        let textoBot = '🛒 Comprar Agora';
        let avisoVip = '';
        if (tipo === 'vip') {
          const jaComprou = await verificarJaComprou(docId);
          if (jaComprou) {
            classeBot = ' style="background: #9E9E9E; cursor: not-allowed;" disabled';
            textoBot = '✓ Já Comprado';
            avisoVip = '<div class="info" style="background: #e8f5e9; color: #2e7d32; padding: 8px; border-radius: 6px; text-align: center; font-weight: bold; margin-bottom: 10px;">✓ Você já comprou este produto</div>';
            console.log("  ✓ Produto VIP já comprado por este usuário");
          }
        }

        const rendimento = Number(p.valorRendimento ?? p.rendaDiaria ?? 0);
        const labelRendimento = p.tipoRendimento === 'lucro' ? 'Lucro' : 'Renda Diária';
        const totalRendimento = rendimento * Number(p.ciclo ?? 0);

        card.innerHTML = `
          <img src="${p.imagem || 'https://via.placeholder.com/300x200/667eea/FFFFFF?text=Produto'}" alt="${p.nome}" class="produto-img" onerror="this.src='https://via.placeholder.com/300x200/667eea/FFFFFF?text=Produto'">
          <div class="chip">${p.nome}</div>
          <div class="valor">R$ ${p.preco.toFixed(2)}</div>
          <div class="info">💰 ${labelRendimento}: <span class="destaque">R$ ${rendimento.toFixed(2)}</span></div>
          <div class="info">⏰ Ciclo: ${p.ciclo} dias</div>
          <div class="info">📈 Total: R$ ${totalRendimento.toFixed(2)}</div>
          ${avisoVip}
          <button onclick="comprarProduto('${docId}', '${p.nome}', ${p.preco}, ${rendimento}, ${p.ciclo}, '${tipo}')"${classeBot}>
            ${textoBot}
          </button>
        `;

        if(tipo === 'vip') {
          vip.appendChild(card);
        } else if(tipo === 'diario') {
          diario.appendChild(card);
        } else if(tipo === 'fixo') {
          fixo.appendChild(card);
        } else {
          eventos.appendChild(card);
        }
      }
    }, (error) => {
      console.error("Erro ao carregar produtos:", error);
      eventos.innerHTML = "<div style='text-align: center; color: white; font-size: 1.2rem; margin-top: 50px;'>Erro ao carregar produtos</div>";
      vip.innerHTML = eventos.innerHTML;
      diario.innerHTML = eventos.innerHTML;
      fixo.innerHTML = eventos.innerHTML;
    });
}

// 🎛️ ADICIONAR PRODUTO (ADMIN)
async function adicionarProduto(){
  const nome = document.getElementById("nome").value.trim();
  const preco = Number(document.getElementById("preco").value);
  const renda = Number(document.getElementById("renda").value);
  const ciclo = Number(document.getElementById("ciclo").value);
  const tipo = document.getElementById("tipo").value;
  const imagem = document.getElementById("imagem").value.trim();

  console.log("Produto será salvo na aba:", tipo);

  // Limpar mensagens
  document.getElementById("mensagemSucesso").style.display = "none";
  document.getElementById("mensagemErro").style.display = "none";

  if(!nome || !preco || !renda || !ciclo){
    mostrarErro("Preencha todos os campos obrigatórios");
    return;
  }

  if(!tipo){
    alert("Escolha em qual aba o produto será adicionado!");
    return;
  }

  if(preco <= 0 || renda < 0 || ciclo <= 0){
    mostrarErro("Os valores devem ser maiores que zero");
    return;
  }

  try {
    await window.SistemaAuth.db.collection("produtos").add({
      nome: nome,
      preco: preco,
      rendaDiaria: renda,
      ciclo: ciclo,
      tipo: tipo,
      imagem: imagem || "https://via.placeholder.com/300x200/667eea/FFFFFF?text=Produto",
      ativo: true,
      criadoEm: window.SistemaAuth.firebase.firestore.FieldValue.serverTimestamp(),
      atualizadoEm: window.SistemaAuth.firebase.firestore.FieldValue.serverTimestamp()
    });

    // Limpa os campos
    document.getElementById("nome").value = "";
    document.getElementById("preco").value = "";
    document.getElementById("renda").value = "";
    document.getElementById("ciclo").value = "";
    document.getElementById("tipo").value = "";
    document.getElementById("imagem").value = "";
    atualizarPreviewTipo();

    mostrarSucesso("✅ Produto adicionado com sucesso!");
    carregarListaAdmin(); // Recarregar lista

  } catch(e) {
    mostrarErro("❌ Erro ao adicionar produto: " + e.message);
    console.error("Erro:", e);
  }
}

// 📋 CARREGAR LISTA ADMIN
function carregarListaAdmin(){
  const div = document.getElementById("adminLista");

  window.SistemaAuth.db.collection("produtos")
    .orderBy("criadoEm", "asc")
    .onSnapshot((snapshot) => {
      div.innerHTML = "";

      if(snapshot.empty) {
        div.innerHTML = "<div style='text-align: center; color: #666; padding: 40px;'>Nenhum produto cadastrado</div>";
        return;
      }

      // Calcular métricas
      let total = 0;
      let ativos = 0;
      let porTipo = { eventos: 0, vip: 0, diario: 0, fixo: 0 };

      snapshot.forEach((doc) => {
        const p = doc.data();
        total++;
        if(p.ativo) ativos++;
        const tipo = p.tipo || "eventos";
        if(porTipo[tipo] !== undefined) porTipo[tipo]++;
      });

      document.getElementById('metricas').innerHTML = `
        <div class="admin-info"><strong>Total de Produtos:</strong> ${total}</div>
        <div class="admin-info"><strong>Produtos Ativos:</strong> ${ativos}</div>
        <div class="admin-info"><strong>Por Tipo:</strong> Eventos: ${porTipo.eventos}, VIP: ${porTipo.vip}, Diário: ${porTipo.diario}, Fixo: ${porTipo.fixo}</div>
      `;

      snapshot.forEach((doc) => {
        const p = doc.data();
        const linha = document.createElement("div");
        linha.className = "produto-admin";

        const statusClass = p.ativo ? "status-ativo" : "status-inativo";
        const statusText = p.ativo ? "✓ Ativo" : "✗ Inativo";
        const rendimentoAdmin = Number(p.valorRendimento ?? p.rendaDiaria ?? 0);
        const labelAdmin = p.tipoRendimento === 'lucro' ? 'Lucro' : 'Renda diária';

        linha.innerHTML = `
          <div>
            <b>${p.nome}</b>
            <span class="status-badge ${statusClass}">${statusText}</span>
          </div>
          <div class="admin-info">
            <strong>Preço:</strong> R$ ${p.preco.toFixed(2)}
          </div>
          <div class="admin-info">
            <strong>${labelAdmin}:</strong> R$ ${rendimentoAdmin.toFixed(2)}
          </div>
          <div class="admin-info">
            <strong>Ciclo:</strong> ${p.ciclo} dias
          </div>
          <div class="admin-info">
            <strong>Tipo:</strong> <span class="tipo-badge" style="background-color: ${getCorTipo(p.tipo || 'eventos')}; color: white; padding: 4px 8px; border-radius: 12px; font-size: 0.8rem;">${getNomeTipo(p.tipo || 'eventos')}</span>
          </div>
          <div class="admin-actions">
            <button class="btn-editar" onclick="editarProduto('${doc.id}')">✏️ Editar</button>
            <button class="btn-editar" onclick="duplicarProduto('${doc.id}')">📋 Duplicar</button>
            ${p.ativo ?
              `<button class="btn-desativar" onclick="desativarProduto('${doc.id}')">🚫 Desativar</button>` :
              `<button class="btn-desativar" onclick="ativarProduto('${doc.id}')">✅ Ativar</button>`
            }
            <button class="btn-excluir" onclick="excluirProduto('${doc.id}')">🗑️ Excluir</button>
          </div>
        `;

        div.appendChild(linha);
      });
    }, (error) => {
      console.error("Erro ao carregar lista admin:", error);
      div.innerHTML = "<div style='text-align: center; color: #c62828; padding: 40px;'>Erro ao carregar produtos</div>";
    });
}

// ✏️ EDITAR PRODUTO (ADMIN)
let produtoEditandoId = null;

function editarProduto(id){
  produtoEditandoId = id;
  window.SistemaAuth.db.collection("produtos").doc(id).get().then(doc => {
    if(!doc.exists){
      mostrarErro("Produto não encontrado.");
      return;
    }

    const produto = doc.data();
    document.getElementById('editNome').value = produto.nome;
    document.getElementById('editPreco').value = produto.preco;
    document.getElementById('editRenda').value = produto.rendaDiaria;
    document.getElementById('editCiclo').value = produto.ciclo;
    document.getElementById('editTipo').value = produto.tipo || "eventos";
    document.getElementById('editImagem').value = produto.imagem || "";
    atualizarPreviewTipoEdit(); // Atualizar preview no modal
    document.getElementById('editModal').style.display = 'block';
  }).catch(e => {
    mostrarErro("Erro ao carregar produto: " + e.message);
  });
}

function fecharModal() {
  document.getElementById('editModal').style.display = 'none';
}

document.getElementById('editForm').addEventListener('submit', async e => {
  e.preventDefault();

  const nome = document.getElementById('editNome').value.trim();
  const preco = Number(document.getElementById('editPreco').value);
  const renda = Number(document.getElementById('editRenda').value);
  const ciclo = Number(document.getElementById('editCiclo').value);
  const tipo = document.getElementById('editTipo').value;
  const imagem = document.getElementById('editImagem').value.trim();

  if(!nome || preco <= 0 || renda < 0 || ciclo <= 0){
    alert("Dados inválidos. Nome obrigatório e valores numéricos válidos são necessários.");
    return;
  }

  try {
    await window.SistemaAuth.db.collection("produtos").doc(produtoEditandoId).update({
      nome,
      preco,
      rendaDiaria: renda,
      ciclo,
      tipo,
      imagem: imagem || "https://via.placeholder.com/300x200/667eea/FFFFFF?text=Produto",
      atualizadoEm: window.SistemaAuth.firebase.firestore.FieldValue.serverTimestamp()
    });

    mostrarSucesso("✅ Produto atualizado com sucesso!");
    fecharModal();
  } catch(e) {
    mostrarErro("❌ Erro ao editar produto: " + e.message);
    console.error(e);
  }
});

// 🚫 DESATIVAR PRODUTO (ADMIN)
async function desativarProduto(id){
  if(confirm("Tem certeza que deseja desativar este produto?")) {
    try {
      await window.SistemaAuth.db.collection("produtos").doc(id).update({
        ativo: false,
        atualizadoEm: window.SistemaAuth.firebase.firestore.FieldValue.serverTimestamp()
      });
      mostrarSucesso("✅ Produto desativado!");
    } catch(e) {
      mostrarErro("❌ Erro: " + e.message);
    }
  }
}

// ✅ ATIVAR PRODUTO (ADMIN)
async function ativarProduto(id){
  try {
    await window.SistemaAuth.db.collection("produtos").doc(id).update({
      ativo: true,
      atualizadoEm: window.SistemaAuth.firebase.firestore.FieldValue.serverTimestamp()
    });
    mostrarSucesso("✅ Produto ativado!");
  } catch(e) {
    mostrarErro("❌ Erro: " + e.message);
  }

// 🗑️ EXCLUIR PRODUTO (ADMIN)
async function excluirProduto(id){
  if(confirm("Tem certeza que deseja EXCLUIR este produto? Esta ação não pode ser desfeita!")) {
    try {
      await window.SistemaAuth.db.collection("produtos").doc(id).delete();
      mostrarSucesso("✅ Produto excluído!");
    } catch(e) {
      mostrarErro("❌ Erro: " + e.message);
    }
  }
}

// 📢 FUNÇÕES DE MENSAGENS
function mostrarSucesso(mensagem){
  const msg = document.getElementById("mensagemSucesso");
  msg.innerText = mensagem;
  msg.style.display = "block";
  document.getElementById("mensagemErro").style.display = "none";
  setTimeout(() => { msg.style.display = "none"; }, 5000);
}

function mostrarErro(mensagem){
  const msg = document.getElementById("mensagemErro");
  msg.innerText = mensagem;
  msg.style.display = "block";
  document.getElementById("mensagemSucesso").style.display = "none";
  setTimeout(() => { msg.style.display = "none"; }, 5000);
}

function logout() {
  window.SistemaAuth.fazerLogout();
}

// 🧩 FUNÇÕES ADICIONAIS
function trocarAba(aba) {
  document.getElementById("produtosEventos").style.display = "none";
  document.getElementById("produtosVip").style.display = "none";
  document.getElementById("produtosDiario").style.display = "none";
  document.getElementById("produtosFixo").style.display = "none";

  document.querySelectorAll('.abas button').forEach(btn => btn.classList.remove('active'));
  const botao = document.querySelector(`.abas button[onclick="trocarAba('${aba}')"]`);
  if (botao) botao.classList.add('active');

  if(aba === "eventos") document.getElementById("produtosEventos").style.display = "block";
  if(aba === "vip") document.getElementById("produtosVip").style.display = "block";
  if(aba === "diario") document.getElementById("produtosDiario").style.display = "block";
  if(aba === "fixo") document.getElementById("produtosFixo").style.display = "block";
}

async function duplicarProduto(id) {
  try {
    const doc = await window.SistemaAuth.db.collection("produtos").doc(id).get();
    if(!doc.exists) {
      mostrarErro("Produto não encontrado.");
      return;
    }

    const p = doc.data();
    await window.SistemaAuth.db.collection("produtos").add({
      ...p,
      nome: p.nome + " (Cópia)",
      criadoEm: window.SistemaAuth.firebase.firestore.FieldValue.serverTimestamp(),
      atualizadoEm: window.SistemaAuth.firebase.firestore.FieldValue.serverTimestamp()
    });

    mostrarSucesso("✅ Produto duplicado com sucesso!");
  } catch(e) {
    mostrarErro("❌ Erro ao duplicar produto: " + e.message);
  }
}

function getNomeTipo(tipo) {
  const tipos = {
    eventos: "🎉 Eventos",
    vip: "👑 VIP",
    diario: "📅 Diário",
    fixo: "🔒 Fixo"
  };
  return tipos[tipo] || "🎉 Eventos";
}

function getCorTipo(tipo) {
  const cores = {
    eventos: "#4CAF50",
    vip: "#9C27B0",
    diario: "#2196F3",
    fixo: "#FF9800"
  };
  return cores[tipo] || "#4CAF50";
}

function atualizarPreviewTipo() {
  const tipo = document.getElementById("tipo").value;
  const preview = document.getElementById("previewTipo");

  if (!tipo) {
    preview.innerHTML = "Escolha a aba do produto acima.";
    return;
  }

  const nome = getNomeTipo(tipo);
  const cor = getCorTipo(tipo);
  preview.innerHTML = `Vai aparecer em: <span style="color: ${cor};">${nome}</span>`;
}

function atualizarPreviewTipoEdit() {
  const tipo = document.getElementById("editTipo").value;
  const preview = document.getElementById("editPreviewTipo");
  const nome = getNomeTipo(tipo || "eventos");
  const cor = getCorTipo(tipo || "eventos");
  preview.innerHTML = `Vai aparecer em: <span style="color: ${cor};">${nome}</span>`;
}
