<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Produtos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topo">
  <a href="painel.html" class="voltar">←</a>
  <h1>📦 Produtos Magaxia</h1>
</div>

<span id="saldo">Saldo: R$ 0,00</span>

<div id="loading" class="loading">Carregando produtos...</div>
<div class="produtos" id="listaProdutos"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
<script>
let uid = null;
let saldoAtual = 0;

const produtosDefault = [
  { id: 1, nome: "⚙️ Chip: CPU S02", preco: 10, rendaDiaria: 3, ciclo: 30 },
  { id: 2, nome: "⚙️ Chip: CPU S04", preco: 20, rendaDiaria: 12, ciclo: 30 },
  { id: 3, nome: "⚙️ Chip: CPU S06", preco: 30, rendaDiaria: 17, ciclo: 30 },
  { id: 4, nome: "⚙️ Chip: CPU S08", preco: 65, rendaDiaria: 25, ciclo: 30 },
  { id: 5, nome: "⚙️ Chip: CPU S10", preco: 85, rendaDiaria: 34, ciclo: 30 }
];

const formatador = new Intl.NumberFormat("pt-BR", {
  style: "currency",
  currency: "BRL"
});

function atualizarSaldoTela() {
  document.getElementById("saldo").innerText = "Saldo: " + formatador.format(saldoAtual);
}

// Autenticação Firebase
window.firebaseHelpers.getAuth().onAuthStateChanged(async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  uid = user.uid;

  try {
    const docUser = await window.firebaseHelpers.getUsuariosCollection().doc(uid).get();
    
    if (docUser.exists) {
      saldoAtual = docUser.data().saldo || 0;
    } else {
      // Criar documento se não existir
      await window.firebaseHelpers.getUsuariosCollection().doc(uid).set({
        saldo: 100,
        dataCadastro: firebase.firestore.FieldValue.serverTimestamp()
      });
      saldoAtual = 100;
    }

    atualizarSaldoTela();
    carregarProdutos();
    
    // Iniciar listener em tempo real
    window.firebaseHelpers.getUsuariosCollection().doc(uid).onSnapshot((doc) => {
      if (doc.exists) {
        saldoAtual = doc.data().saldo || 0;
        atualizarSaldoTela();
      }
    });
  } catch (error) {
    console.error("Erro ao autenticar:", error);
  }
});

function carregarProdutos() {
  const container = document.getElementById("listaProdutos");
  const loading = document.getElementById("loading");

  try {
    window.firebaseHelpers.getProdutosCollection()
      .where("ativo", "==", true)
      .onSnapshot((snapshot) => {
        container.innerHTML = "";
        loading.style.display = "none";

        if (snapshot.empty) {
          produtosDefault.forEach((p) => criarCard(container, p));
          return;
        }

        snapshot.forEach((doc) => {
          const p = doc.data();
          criarCard(container, { id: doc.id, ...p });
        });
      }, (error) => {
        console.error("Erro ao carregar produtos:", error);
        container.innerHTML = "";
        loading.style.display = "none";
        produtosDefault.forEach((p) => criarCard(container, p));
      });
  } catch (error) {
    console.error("Erro inesperado ao carregar produtos:", error);
    container.innerHTML = "";
    loading.style.display = "none";
    produtosDefault.forEach((p) => criarCard(container, p));
  }
}

function criarCard(container, produto) {
  const card = document.createElement("div");
  card.className = "card";

  const imagemUrl = produto.imagem || "https://via.placeholder.com/250x150?text=CPU";

  card.innerHTML = `
    <img class="produto-img" src="${imagemUrl}" onerror="this.src='https://via.placeholder.com/250x150?text=CPU'" alt="${produto.nome}">
    <h3>${produto.nome}</h3>
    <div class="valor">Preço: ${window.firebaseHelpers.formatCurrency(produto.preco)}</div>
    <p><strong>💰 Renda diária:</strong> <span class="destaque">${window.firebaseHelpers.formatCurrency(produto.rendaDiaria)}</span></p>
    <p><strong>🔁 Ciclo:</strong> ${produto.ciclo} dias</p>
    <button onclick="comprarProduto('${produto.id}', '${produto.nome.replace(/'/g, "\\'")}', ${produto.preco}, ${produto.rendaDiaria}, ${produto.ciclo})">Comprar</button>
  `;

  container.appendChild(card);
}

async function comprarProduto(idProduto, nome, preco, renda, ciclo) {
  if (!uid) {
    alert("Você precisa estar autenticado");
    return;
  }

  if (preco > saldoAtual) {
    alert("Saldo insuficiente");
    return;
  }

  const userRef = window.firebaseHelpers.getUsuariosCollection().doc(uid);

  try {
    await window.firebaseHelpers.getDb().runTransaction(async (transaction) => {
      const doc = await transaction.get(userRef);
      const saldoBanco = doc.exists ? doc.data().saldo || 0 : 0;

      if (preco > saldoBanco) {
        throw new Error("Saldo insuficiente");
      }

      const novoSaldo = saldoBanco - preco;
      transaction.update(userRef, { saldo: novoSaldo });

      transaction.set(window.firebaseHelpers.getDb().collection("compras").doc(), {
        uid: uid,
        produtoId: idProduto,
        produto: nome,
        valor: preco,
        rendaDiaria: renda,
        ciclo: ciclo,
        status: "ativo",
        inicio: firebase.firestore.FieldValue.serverTimestamp()
      });

      saldoAtual = novoSaldo;
    });

    atualizarSaldoTela();
    alert("Produto comprado com sucesso!");
  } catch (error) {
    console.error("Erro ao comprar produto:", error);
    alert("Erro ao comprar produto, tente novamente");
  }
}

</script>

</body>
</html>
