<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Produtos | Magaxia</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
  background-attachment:fixed;
  color:black;
  position:relative;
  overflow-x:hidden;
  padding:40px 20px;
}

body::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:radial-gradient(circle at 20% 50%, rgba(102, 126, 234, 0.4) 0%, transparent 50%),
              radial-gradient(circle at 80% 80%, rgba(240, 147, 251, 0.4) 0%, transparent 50%);
  pointer-events:none;
  animation:float 15s ease-in-out infinite;
}

@keyframes float{
  0%, 100%{transform:translate(0, 0)}
  50%{transform:translate(20px, -20px)}
}

h1{
  text-align:center;
  font-size:2.6rem;
  font-weight:800;
  margin-bottom:15px;
  text-shadow:0 4px 20px rgba(0,0,0,0.3);
  background:linear-gradient(90deg,#ffffff,#e0e7ff);
  background-clip:text;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

#saldo{
  text-align:center;
  font-size:1.4rem;
  margin-bottom:40px;
  font-weight:600;
  color:white;
  text-shadow:0 4px 15px rgba(0,0,0,0.3);
}

.produtos{
  max-width:1200px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:30px;
  position:relative;
  z-index:1;
}

.card{
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-radius:30px;
  padding:24px;
  text-align:center;
  border:1px solid rgba(255,255,255,0.2);
  box-shadow:0 20px 60px rgba(0,0,0,0.25);
  transition:all 0.3s ease;
}

.card:hover{
  background:rgba(255,255,255,0.15);
  border-color:rgba(255,255,255,0.3);
  box-shadow:0 25px 75px rgba(0,0,0,0.35);
  transform:translateY(-8px);
}

.produto-img{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:16px;
  margin-bottom:18px;
}

.chip{
  font-size:1.25rem;
  font-weight:700;
  margin-bottom:12px;
}

.valor{
  font-size:2rem;
  margin:15px 0;
  background:linear-gradient(90deg, #00d4ff, #ff00ff);
  background-clip:text;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  font-weight:800;
  text-shadow:0 0 30px rgba(57,198,255,0.8), 0 0 60px rgba(184,76,255,0.6);
  filter:brightness(1.3);
}

.info{
  margin:8px 0;
  opacity:0.95;
  color:white;
}

.destaque{
  color:#39c6ff;
  font-weight:600;
}

button{
  width:100%;
  margin-top:22px;
  padding:16px;
  border-radius:15px;
  border:none;
  cursor:pointer;
  color:black;
  background:linear-gradient(135deg, #39c6ff, #b84cff);
  font-family:'Poppins',sans-serif;
  font-weight:600;
  font-size:1rem;
  transition:all 0.3s ease;
  position:relative;
  overflow:hidden;
  box-shadow:0 8px 25px rgba(57,198,255,0.3);
}

button::after{
  content:'';
  position:absolute;
  top:50%;
  left:50%;
  width:0;
  height:0;
  background:rgba(255,255,255,0.3);
  border-radius:50%;
  transform:translate(-50%, -50%);
  transition:width 0.6s, height 0.6s;
}

button:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 35px rgba(57,198,255,0.4);
}

button:active::after{
  width:300px;
  height:300px;
}

.back-button{
  position:fixed;
  top:20px;
  left:20px;
  width:50px;
  height:50px;
  background:linear-gradient(135deg, #39c6ff, #b84cff);
  border:none;
  border-radius:50%;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  transition:all 0.3s ease;
  box-shadow:0 8px 25px rgba(57,198,255,0.3);
  z-index:100;
}

.back-button:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 35px rgba(57,198,255,0.4);
}

.back-button:active{
  transform:translateY(0);
}
</style>
</head>

<body>

<button class="back-button" onclick="window.location.href='painel.html'">←</button>

<h1>📦 Produtos Magaxia</h1>

<div id="saldo">Saldo: Carregando...</div>

<div class="produtos"></div>

<script>

const firebaseConfig={
apiKey:"AIzaSyAcVPgUHbL4N9U1-H68klmGKWQF-YGleyc",
authDomain:"vastbitloud-2872a.firebaseapp.com",
projectId:"vastbitloud-2872a"
};

if(!firebase.apps.length){
firebase.initializeApp(firebaseConfig);
}

const auth=firebase.auth();
const db=firebase.firestore();

let uid=null;
let saldoAtual=0;

const formatador=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});

// CARREGADOR DE PRODUTOS EM TEMPO REAL

function carregarProdutos(){
const container=document.querySelector(".produtos");

db.collection("produtos").onSnapshot(snapshot=>{

container.innerHTML="";

if(snapshot.empty){
container.innerHTML="<p style='grid-column:1/-1;text-align:center;color:white;padding:40px;'>Nenhum produto disponível</p>";
return;
}

snapshot.forEach(doc=>{
const p=doc.data();

if(!p.nome || p.preco===undefined || !p.rendaDiaria || !p.ciclo){
return;
}

const card=document.createElement("div");
card.className="card";

const precoNum=Number(p.preco);
const rendaNum=Number(p.rendaDiaria);
const cicloNum=Number(p.ciclo);

card.innerHTML=`
<img class="produto-img" src="${p.imagem||''}" alt="${p.nome}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27260%27 height=%27160%27%3E%3Crect fill=%27%23999%27 width=%27260%27 height=%27160%27/%3E%3C/svg%3E'">
<div class="chip">⚙️ ${p.nome}</div>
<div class="valor">Preço: ${formatador.format(precoNum)}</div>
<div class="info">💰 Renda diária: <span class="destaque">${formatador.format(rendaNum)}</span></div>
<div class="info">🔁 Ciclo: ${cicloNum} dias</div>
<button onclick="comprarProduto('${p.nome.replace(/'/g,"\\'")}',${precoNum},${rendaNum},${cicloNum})">Comprar</button>
`;

container.appendChild(card);
});

});
}

// ATUALIZAR SALDO EM TEMPO REAL

function atualizarSaldo(){
db.collection("users").doc(uid).onSnapshot(doc=>{
if(doc.exists){
saldoAtual=doc.data().saldo||0;
document.getElementById("saldo").innerText="Saldo: "+formatador.format(saldoAtual);
}
});
}

// AUTENTICAÇÃO E INICIALIZAÇÃO

auth.onAuthStateChanged(user=>{
if(!user){
location.href="login.html";
return;
}

uid=user.uid;
atualizarSaldo();
carregarProdutos();
});



// COMPRAR PRODUTO

async function comprarProduto(nome, preco, renda, ciclo){
try {
if(preco > saldoAtual){
alert("Saldo insuficiente");
return;
}

const userRef = db.collection("users").doc(uid);

await db.runTransaction(async t => {
const userDoc = await t.get(userRef);
const saldoBanco = userDoc.data().saldo || 0;

if(preco > saldoBanco) throw new Error("Saldo insuficiente");

const novoSaldo = saldoBanco - preco;

t.update(userRef, { saldo: novoSaldo });

t.set(db.collection("compras").doc(), {
uid: uid,
produto: nome,
valor: preco,
rendaDiaria: renda,
ciclo: ciclo,
status: "ativo",
inicio: firebase.firestore.FieldValue.serverTimestamp()
});

saldoAtual = novoSaldo;
});

alert("Produto comprado com sucesso");
} catch(e) {
alert("Erro: " + e.message);
}
}

</script>

</body>
</html>
