<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ativar VIP5</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d0d;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #f5a623, #f0541e);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 100px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #fff;
    }

    p.subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #ccc;
      margin-bottom: 8px;
      letter-spacing: 0.4px;
    }

    input[type="text"] {
      width: 100%;
      padding: 13px 16px;
      background: #111;
      border: 1px solid #333;
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      letter-spacing: 2px;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 20px;
    }

    input[type="text"]::placeholder {
      color: #444;
      letter-spacing: 1px;
      text-transform: none;
    }

    input[type="text"]:focus {
      border-color: #f5a623;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #f5a623, #f0541e);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover:not(:disabled) {
      opacity: 0.9;
    }

    button:active:not(:disabled) {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #vip5-message {
      margin-top: 16px;
      font-size: 13px;
      text-align: center;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">VIP5</span>
    <h1>Ativar Acesso VIP</h1>
    <p class="subtitle">Digite o código de ativação para liberar seu acesso VIP5.</p>

    <form id="vip5-form" autocomplete="off">
      <label for="vip5-code-input">Código de ativação</label>
      <input
        type="text"
        id="vip5-code-input"
        placeholder="Ex: ABC123"
        maxlength="20"
        required
      />
      <button type="submit" id="vip5-btn">Ativar</button>
    </form>

    <p id="vip5-message"></p>
  </div>

  <script type="module" src="vip5.js"></script>
</body>
</html>
