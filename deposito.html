<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Depósito • Magaxia</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<!-- Sistema de Autenticação Centralizado -->
<script src="sistema-auth.js"></script>

<!-- QRCode -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#667eea,#764ba2,#f093fb);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    visibility:hidden;
}

.container{
    max-width:500px;
    width:100%;
    text-align:center;
    padding:30px;
}

.card{
    background:rgba(255,255,255,0.1);
    padding:30px;
    border-radius:20px;
}

.valores{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.valor-btn{
    padding:12px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    background:#ffffff22;
    color:white;
    font-weight:bold;
}

input{
    width:100%;
    padding:14px;
    margin-top:15px;
    border-radius:12px;
    border:none;
    text-align:center;
}

button{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:none;
    border-radius:12px;
    background:#39c6ff;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

#qrcode{
    margin-top:20px;
    display:flex;
    justify-content:center;
}

.info{
    margin-top:15px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<h1>💎 DEPÓSITO</h1>
<p>Escolha um valor e pague via Pix</p>

<div class="card">

<div class="valores">
<button class="valor-btn" onclick="setValor(10)">R$ 10</button>
<button class="valor-btn" onclick="setValor(20)">R$ 20</button>
<button class="valor-btn" onclick="setValor(30)">R$ 30</button>
<button class="valor-btn" onclick="setValor(65)">R$ 65</button>
<button class="valor-btn" onclick="setValor(85)">R$ 85</button>
<button class="valor-btn" onclick="setValor(100)">R$ 100</button>
</div>

<input type="number" id="valor" placeholder="Digite o valor" min="1">

<button onclick="gerarPix()">
📲 Gerar QR Code Pix
</button>

<div id="qrcode"></div>

<div id="pix-area" style="display:none;">
<textarea id="pixCode" readonly></textarea>
<button onclick="copyPixCode()">📋 Copiar código Pix</button>
</div>

<button onclick="confirmar()">
✅ Já fiz o Pix
</button>

<div class="info">
⏱️ O saldo será creditado após aprovação do administrador
</div>

</div>
</div>

<script>

// Usando firebase-helper.js: auth e db já configurados

let uid = null;
let valorAtual = 0;

// 🔐 Proteção de acesso e dados do depósito
document.addEventListener('DOMContentLoaded', function() {
  console.log('🔐 Verificando autenticação no depósito...');

  // Usar sistema centralizado para verificar login
  window.SistemaAuth.verificarLogin((autenticado, dadosUsuario) => {
    if (!autenticado) {
      console.log('❌ Usuário não autenticado, redirecionando para login...');
      window.location.href = 'login.html';
      return;
    }

    console.log('✅ Usuário autenticado, carregando dados do depósito...');

    // Inicializar variáveis globais
    uid = dadosUsuario.uid;

    // RECUPERAR VALOR SALVO (se voltou de redirecionamento)
    const valorSalvo = sessionStorage.getItem('depositoValor');
    if (valorSalvo) {
      valorAtual = parseFloat(valorSalvo);
      document.getElementById("valor").value = valorAtual;
      sessionStorage.removeItem('depositoValor'); // Limpar após usar
      console.log('✅ Valor recuperado:', valorAtual);
    }

    // Tornar body visível
    document.body.style.visibility = "visible";

    // Escutar depósitos aprovados
    escutarDepositosAprovados();
  });
});

// DEFINIR VALOR

function setValor(v){

valorAtual = v;

document.getElementById("valor").value = v;

}

// GERAR PIX

function gerarPix(){

const inp = document.getElementById("valor");

const parsed = Number(inp.value);

if(!parsed || parsed <= 0){
alert("Selecione um valor");
return;
}

valorAtual = parsed;

const valoresAceitos = [10,20,30,65,85,100];

if(!valoresAceitos.includes(valorAtual)){
alert("Valor inválido");
return;
}

// SALVAR VALOR PARA RECUPERAR APÓS REDIRECIONAMENTO
sessionStorage.setItem('depositoValor', valorAtual.toString());

// REDIRECIONAMENTO

const urls = {
10: "https://pixgo.org/recurrence/checkout.php?id=392",
20: "https://pixgo.org/recurrence/checkout.php?id=431",
30: "https://pixgo.org/recurrence/checkout.php?id=432",
65: "https://pixgo.org/recurrence/checkout.php?id=433",
85: "https://pixgo.org/recurrence/checkout.php?id=434",
100: "https://pixgo.org/recurrence/checkout.php?id=435"
};

if(urls[valorAtual]){
window.location.href = urls[valorAtual];
return;
}

// QR LOCAL

const payloadPix = `PIX|VALOR:${valorAtual}|UID:${uid}`;

const pixArea = document.getElementById("pix-area");

pixArea.style.display = "block";

document.getElementById("pixCode").value = payloadPix;

const qrDiv = document.getElementById("qrcode");

qrDiv.innerHTML = "";

new QRCode(qrDiv,{
text: payloadPix,
width: 200,
height: 200
});

}

// COPIAR PIX

function copyPixCode(){

const text = document.getElementById("pixCode").value;

navigator.clipboard.writeText(text);

alert("Código Pix copiado");

}

// =============================
// SISTEMA DE COMISSÃO AUTOMÁTICA (3 NÍVEIS)
// =============================

async function gerarComissaoIndicacao(deposito, depositoId) {
    try {
        const db = window.SistemaAuth.db;
        const firebase = window.SistemaAuth.firebase;

        if (!deposito || deposito.status !== "aprovado") {
            console.log("⏭️ Depósito não aprovado ou inválido:", depositoId);
            return;
        }

        if (deposito.comissaoGerada === true) {
            console.log("⏭️ Comissão já gerada para o depósito:", depositoId);
            return;
        }

        const usuarioId = deposito.usuarioId || deposito.uid;
        if (!usuarioId) {
            console.error("❌ Depósito sem usuário válido:", depositoId);
            return;
        }

        console.log("Depósito aprovado:", depositoId);

        const usuarioDoc = await db.collection("users").doc(usuarioId).get();
        if (!usuarioDoc.exists) {
            console.error("❌ Usuário do depósito não encontrado:", usuarioId);
            return;
        }

        const usuario = usuarioDoc.data();
        const nivel1 = usuario.indicadoPor || null;
        const nivel2 = nivel1 ? await buscarIndicador(nivel1) : null;
        const nivel3 = nivel2 ? await buscarIndicador(nivel2) : null;

        const valorDeposito = Number(deposito.valor) || 0;
        const comissaoNivel1 = valorDeposito * 0.20;
        const comissaoNivel2 = valorDeposito * 0.05;
        const comissaoNivel3 = valorDeposito * 0.03;

        if (nivel1) {
            await adicionarSaldo(nivel1, comissaoNivel1, 1, usuarioId, usuario, depositoId);
        }

        if (nivel2) {
            await adicionarSaldo(nivel2, comissaoNivel2, 2, usuarioId, usuario, depositoId);
        }

        if (nivel3) {
            await adicionarSaldo(nivel3, comissaoNivel3, 3, usuarioId, usuario, depositoId);
        }

        await db.collection("depositos").doc(depositoId).update({
            comissaoGerada: true
        });

        console.log("Comissão gerada para:", usuarioId);
    } catch (erro) {
        console.error("Erro ao gerar comissão:", erro);
    }
}

async function buscarIndicador(usuarioId) {
    const db = window.SistemaAuth.db;
    const indicadorDoc = await db.collection("users").doc(usuarioId).get();
    if (!indicadorDoc.exists) return null;
    return indicadorDoc.data().indicadoPor || null;
}

async function adicionarSaldo(usuarioId, valorComissao, nivel, usuarioOrigemId, usuarioOrigemDados, depositoId) {
    try {
        if (!valorComissao || valorComissao <= 0) return;

        const db = window.SistemaAuth.db;
        const firebase = window.SistemaAuth.firebase;
        const indicadorRef = db.collection("users").doc(usuarioId);
        const indicadorDoc = await indicadorRef.get();
        if (!indicadorDoc.exists) {
            console.log(`⚠️ Indicador nível ${nivel} não encontrado:`, usuarioId);
            return;
        }

        const indicador = indicadorDoc.data();
        const saldoAtual = indicador.saldo || 0;
        const comissaoTotalAtual = indicador.comissaoTotal || 0;
        const totalIndicadosAtual = indicador.totalIndicados || 0;

        await indicadorRef.update({
            saldo: saldoAtual + valorComissao,
            comissaoTotal: comissaoTotalAtual + valorComissao,
            totalIndicados: totalIndicadosAtual + (nivel === 1 ? 1 : 0) // Incrementa apenas para nível 1
        });

        await db.collection("historico_comissoes").add({
            tipo: "comissao_indicacao",
            status: "pago",
            nivel: nivel,
            valor: valorComissao,
            usuarioOrigem: usuarioOrigemId,
            nomeOrigem: usuarioOrigemDados?.nome || "",
            usuario: usuarioId,
            nomeUsuario: indicador.nome || "",
            depositoId: depositoId,
            data: firebase.firestore.FieldValue.serverTimestamp()
        });

        console.log(`✅ Comissão Nível ${nivel} paga: R$ ${valorComissao.toFixed(2)} para ${indicador.nome}`);
    } catch (error) {
        console.error(`❌ Erro ao adicionar saldo nível ${nivel}:`, error);
    }
}

// =============================
// ATUALIZAR SALDO AUTOMATICAMENTE
// =============================



function escutarDepositosAprovados() {
    const db = window.SistemaAuth.db;

    // Escutar TODOS os depósitos aprovados para verificar se somos indicadores
    db.collection("depositos")
        .where("status", "==", "aprovado")
        .onSnapshot(snapshot => {
            snapshot.docChanges().forEach(async change => {
                if (change.type !== "added" && change.type !== "modified") return;

                const deposito = change.doc.data();
                const depositoId = change.doc.id;
                const depositoRef = change.doc.ref;

                if (deposito.comissaoGerada === true) {
                    console.log("⏭️ Comissão já gerada para o depósito:", depositoId);
                    return;
                }

                console.log("Depósito aprovado detectado:", depositoId, deposito);

                try {
                    // Primeiro, creditar o saldo do usuário que fez o depósito (se for o próprio usuário)
                    if (deposito.usuarioId === uid || deposito.uid === uid) {
                        await db.runTransaction(async t => {
                            const userRef = db.collection("users").doc(uid);
                            const userDoc = await t.get(userRef);

                            if (!userDoc.exists) {
                                throw new Error("Usuário não encontrado durante o crédito do depósito");
                            }

                            const saldoAtual = userDoc.data().saldo || 0;
                            const valorDeposito = Number(deposito.valor) || 0;
                            const novoSaldo = saldoAtual + valorDeposito;

                            if (deposito.creditado !== true) {
                                t.update(userRef, {
                                    saldo: novoSaldo
                                });
                                t.update(depositoRef, {
                                    creditado: true
                                });
                                console.log("Saldo atualizado automaticamente:", novoSaldo);
                            } else {
                                console.log("Depósito já creditado, mantendo crédito existente");
                            }
                        });
                    }

                    // Agora, gerar comissão se somos um indicador
                    await gerarComissaoIndicacao(deposito, depositoId);
                } catch (error) {
                    console.error("Erro ao processar depósito aprovado:", error);
                }
            });
        });
}

// Inicia escuta após login

// Removido - agora usa sistema centralizado

// =============================
// CONFIRMAR DEPÓSITO

async function confirmar(){

// Verificar valor no input OU na variável global
const valorInput = document.getElementById("valor").value;
const valorParaConfirmar = valorInput ? Number(valorInput) : valorAtual;

if(valorParaConfirmar <= 0){
alert("Selecione um valor primeiro");
return;
}

// Atualizar valorAtual se necessário
valorAtual = valorParaConfirmar;

// BLOQUEAR DUPLICADO

const existente = await window.SistemaAuth.db
.collection("depositos")
.where("uid","==",uid)
.where("status","==","pendente")
.get();

if(!existente.empty){
alert("Você já possui um depósito pendente");
return;
}

await window.SistemaAuth.db.collection("depositos").add({

uid: uid,
usuarioId: uid,

valor: valorAtual,

status: "pendente",

data: window.SistemaAuth.firebase.firestore
.FieldValue
.serverTimestamp()

});

alert("Depósito registrado com sucesso");

location.reload();

}

</script>



</body>
</html>
