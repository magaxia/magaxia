<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Depósito • Magaxia</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<!-- QRCode -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#667eea,#764ba2,#f093fb);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    visibility:hidden;
}

.container{
    max-width:500px;
    width:100%;
    text-align:center;
    padding:30px;
}

.card{
    background:rgba(255,255,255,0.1);
    padding:30px;
    border-radius:20px;
}

.valores{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.valor-btn{
    padding:12px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    background:#ffffff22;
    color:white;
    font-weight:bold;
}

input{
    width:100%;
    padding:14px;
    margin-top:15px;
    border-radius:12px;
    border:none;
    text-align:center;
}

button{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:none;
    border-radius:12px;
    background:#39c6ff;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

#qrcode{
    margin-top:20px;
    display:flex;
    justify-content:center;
}

.info{
    margin-top:15px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<h1>💎 DEPÓSITO</h1>
<p>Escolha um valor e pague via Pix</p>

<div class="card">

<div class="valores">
<button class="valor-btn" onclick="setValor(10)">R$ 10</button>
<button class="valor-btn" onclick="setValor(20)">R$ 20</button>
<button class="valor-btn" onclick="setValor(30)">R$ 30</button>
<button class="valor-btn" onclick="setValor(65)">R$ 65</button>
<button class="valor-btn" onclick="setValor(85)">R$ 85</button>
<button class="valor-btn" onclick="setValor(100)">R$ 100</button>
</div>

<input type="number" id="valor" placeholder="Digite o valor" min="1">

<button onclick="gerarPix()">
📲 Gerar QR Code Pix
</button>

<div id="qrcode"></div>

<div id="pix-area" style="display:none;">
<textarea id="pixCode" readonly></textarea>
<button onclick="copyPixCode()">📋 Copiar código Pix</button>
</div>

<button onclick="confirmar()">
✅ Já fiz o Pix
</button>

<div class="info">
⏱️ O saldo será creditado após aprovação do administrador
</div>

</div>
</div>

<script>

const firebaseConfig = {
apiKey: "AIzaSyAcVPgUHbL4N9U1-H68klmGKWQF-YGleyc",
authDomain: "vastbitloud-2872a.firebaseapp.com",
projectId: "vastbitloud-2872a"
};

if(!firebase.apps.length)
firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let uid = null;
let valorAtual = 0;

// LOGIN

auth.onAuthStateChanged(user=>{

if(!user){
location.href="login.html";
return;
}

uid = user.uid;

document.body.style.visibility="visible";

});

// DEFINIR VALOR

function setValor(v){

valorAtual = v;

document.getElementById("valor").value = v;

}

const valoresAceitos = [10, 20, 30, 65, 85, 100];
const urls = {
  10: "https://pixgo.org/recurrence/checkout.php?id=392",
  20: "https://pixgo.org/recurrence/checkout.php?id=431",
  30: "https://pixgo.org/recurrence/checkout.php?id=432",
  65: "https://pixgo.org/recurrence/checkout.php?id=433",
  85: "https://pixgo.org/recurrence/checkout.php?id=434",
  100: "https://pixgo.org/recurrence/checkout.php?id=435"
};

// GERAR PIX

function gerarPix() {
  const inp = document.getElementById("valor");
  const parsed = Number(inp.value);

  if (!parsed || parsed <= 0 || !Number.isFinite(parsed)) {
    alert("Selecione um valor válido");
    return;
  }

  const valor = Math.round(parsed);
  if (!valoresAceitos.includes(valor)) {
    alert("Valor inválido. Escolha 10, 20, 30, 65, 85 ou 100");
    return;
  }

  valorAtual = valor;
  inp.value = valorAtual; // garante coerência com input

  if (!uid) {
    alert("Usuário não autenticado. Faça login novamente.");
    location.href = "login.html";
    return;
  }

  // REDIRECIONAMENTO

  if (urls[valorAtual]) {
    window.location.href = urls[valorAtual];
    return;
  }

  // QR LOCAL

  const payloadPix = `PIX|VALOR:${valorAtual}|UID:${uid}`;
  const pixArea = document.getElementById("pix-area");

  pixArea.style.display = "block";
  document.getElementById("pixCode").value = payloadPix;

  const qrDiv = document.getElementById("qrcode");
  qrDiv.innerHTML = "";

  new QRCode(qrDiv, {
    text: payloadPix,
    width: 200,
    height: 200
  });
}

// COPIAR PIX

async function copyPixCode() {
  const text = document.getElementById("pixCode").value;

  if (!text) {
    alert("Gere o código Pix primeiro.");
    return;
  }

  try {
    await navigator.clipboard.writeText(text);
    alert("Código Pix copiado");
  } catch (error) {
    console.error(error);
    alert("Não foi possível copiar. Tente novamente.");
  }
}

// CONFIRMAR DEPÓSITO

async function confirmar() {
  if (!uid) {
    alert("Usuário não autenticado. Faça login novamente.");
    location.href = "login.html";
    return;
  }

  if (valorAtual <= 0 || !valoresAceitos.includes(valorAtual)) {
    alert("Selecione um valor válido primeiro");
    return;
  }

  try {
    const existente = await db
      .collection("depositos")
      .where("uid", "==", uid)
      .where("status", "==", "pendente")
      .get();

    if (!existente.empty) {
      alert("Você já possui um depósito pendente");
      return;
    }

    await db.collection("depositos").add({
      uid: uid,
      valor: valorAtual,
      status: "pendente",
      data: firebase.firestore.FieldValue.serverTimestamp()
    });

    alert("Depósito registrado com sucesso");
    location.reload();
  } catch (error) {
    console.error("Erro ao confirmar depósito:", error);
    alert("Erro ao registrar depósito. Tente novamente mais tarde.");
  }
}

</script>

</body>
</html>
