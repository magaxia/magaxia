<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel VIP Turbo</title>
  <style>
    :root {
      --bg: #07080f;
      --surface: rgba(15, 22, 48, 0.92);
      --text: #eef2ff;
      --muted: #a0aed9;
      --accent: #5bf4ff;
      --accent-2: #5fff9d;
      --danger: #ff6b6b;
      --border: rgba(91, 244, 255, 0.18);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, rgba(44, 108, 255, 0.18), transparent 25%),
                  radial-gradient(circle at 20% 80%, rgba(83, 255, 152, 0.12), transparent 20%),
                  linear-gradient(180deg, #08101f 0%, #04060d 100%);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text);
      padding: 24px;
    }

    .card {
      width: min(520px, 100%);
      background: rgba(10, 18, 41, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius);
      box-shadow: 0 32px 90px rgba(0, 0, 0, 0.35);
      padding: 32px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 2.5vw, 2.6rem);
      color: #5bf4ff;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.7;
    }

    .price {
      font-size: 2.8rem;
      font-weight: 800;
      margin: 0 0 24px;
      color: #ffffff;
    }

    .button-group {
      display: grid;
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 16px;
      padding: 16px 20px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      background: linear-gradient(135deg, #42d5ff, #4de7b7);
      color: #061725;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .message {
      margin-top: 20px;
      padding: 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      line-height: 1.6;
    }

    .message.error {
      color: var(--danger);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(91, 244, 255, 0.15);
      border: 1px solid rgba(91, 244, 255, 0.25);
      color: var(--accent-2);
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="status-badge">Painel VIP Turbo</div>
    <h1>Pagar VIP Turbo</h1>
    <p>Informe o nome do titular e envie sua solicitação VIP Turbo. O valor fixo opcional é R$11 e será registrado automaticamente.</p>

    <div class="price">Valor fixo opcional: R$11</div>

    <div class="input-group" style="margin-bottom: 18px;">
      <label for="titularInput" style="color: var(--muted); font-size: 0.95rem;">Nome do titular</label>
      <input id="titularInput" type="text" placeholder="Nome completo do titular" style="width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: var(--text);" />
    </div>

    <div class="button-group">
      <button id="payButton" class="btn-primary">Enviar pagamento</button>
    </div>

    <div id="statusMessage" class="message">Aguardando autenticação...</div>

    <div id="historicoPagamentos" class="message" style="margin-top: 20px; background: rgba(255,255,255,0.04);">
      <strong>Meus pagamentos VIP Turbo</strong>
      <div id="paymentsList" style="margin-top: 12px; display: grid; gap: 12px;">
        Carregando pagamentos...
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js';
    import { getFirestore, collection, addDoc, serverTimestamp, doc, onSnapshot } from 'https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js';
    import { getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithPopup } from 'https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js';

    const firebaseConfig = {
      apiKey: "AIzaSyAcVPgUHbL4N9U1-H68klmGKWQF-YGleyc",
      authDomain: "vastbitloud-2872a.firebaseapp.com",
      projectId: "vastbitloud-2872a",
      storageBucket: "vastbitloud-2872a.firebasestorage.app",
      messagingSenderId: "952931184412",
      appId: "1:952931184412:web:ee2a0e38826c30dd0cd4d9",
      measurementId: "G-KWVQ0CFHW2"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const payButton = document.getElementById('payButton');
    const statusMessage = document.getElementById('statusMessage');
    const titularInput = document.getElementById('titularInput');
    const paymentsList = document.getElementById('paymentsList');
    const checkoutUrl = 'https://pixgo.org/recurrence/checkout.php?id=1159';
    const fixedValue = 11;

    let currentUser = null;
    let unsubscribeVip = null;
    let unsubscribePayments = null;

    function setStatus(text, isError = false) {
      statusMessage.textContent = text;
      statusMessage.classList.toggle('error', isError);
    }

    function setUiForUser(user) {
      currentUser = user;
      if (!user) {
        setStatus('Faça login em outra página ou aguarde a autenticação automática.');
        payButton.disabled = true;
        paymentsList.innerHTML = '<div>Faça login para ver seus pagamentos.</div>';
        if (unsubscribePayments) {
          unsubscribePayments();
          unsubscribePayments = null;
        }
        return;
      }

      setStatus(`Logado como ${user.displayName || user.email || user.uid}. Aguardando status VIP Turbo...`);
      loginButton.disabled = true;
      payButton.disabled = false;
      watchVipStatus(user.uid);
      watchPayments(user.uid);
    }

    function watchVipStatus(uid) {
      if (unsubscribeVip) {
        unsubscribeVip();
      }

      const userDoc = doc(db, 'users', uid);
      unsubscribeVip = onSnapshot(userDoc, (snapshot) => {
        if (!snapshot.exists()) {
          setStatus('Usuário autenticado, mas o documento ainda não existe. Envie o pagamento para iniciar o processo.');
          return;
        }

        const data = snapshot.data();
        if (data.vipTurbo === true) {
          setStatus('VIP Turbo aprovado! Redirecionando...', false);
          window.location.href = 'metodovipturbo.html';
        } else {
          setStatus('VIP Turbo ainda não aprovado. Envie o pagamento e aguarde o administrador.');
        }
      }, (error) => {
        setStatus(`Erro ao ler status VIP: ${error.message}`, true);
      });
    }

    function watchPayments(uid) {
      if (unsubscribePayments) {
        unsubscribePayments();
      }

      const pagamentosQuery = collection(db, 'pagamentos_vipturbo');
      unsubscribePayments = onSnapshot(pagamentosQuery, (snapshot) => {
        const userPayments = snapshot.docs
          .map(doc => ({ id: doc.id, ...doc.data() }))
          .filter(payment => payment.userId === uid)
          .sort((a, b) => {
            const aTs = a.data ? a.data.seconds || 0 : 0;
            const bTs = b.data ? b.data.seconds || 0 : 0;
            return bTs - aTs;
          });

        if (userPayments.length === 0) {
          paymentsList.innerHTML = '<div>Nenhum pagamento encontrado.</div>';
          return;
        }

        paymentsList.innerHTML = userPayments.map(payment => {
          const date = payment.data && payment.data.toDate ? payment.data.toDate() : new Date();
          const formattedDate = new Intl.DateTimeFormat('pt-BR', {
            dateStyle: 'short',
            timeStyle: 'short'
          }).format(date);

          const statusLabel = payment.status === 'aprovado' ? 'Aprovado' : payment.status === 'rejeitado' ? 'Rejeitado' : 'Pendente';
          const statusColor = payment.status === 'aprovado' ? '#28a745' : payment.status === 'rejeitado' ? '#dc3545' : '#f0ad4e';
          const titular = payment.titular ? payment.titular : 'Titular não informado';

          return `
            <div style="padding: 14px; border-radius: 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);">
              <div style="display: flex; flex-direction: column; gap: 10px;">
                <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;">
                  <div>
                    <strong>R$ ${Number(payment.valor).toFixed(2).replace('.', ',')}</strong>
                    <div style="font-size: 0.90rem; color: var(--muted);">${formattedDate}</div>
                  </div>
                  <span style="padding: 6px 12px; border-radius: 999px; background: ${statusColor}22; color: ${statusColor}; font-size: 0.85rem; font-weight: 700;">${statusLabel}</span>
                </div>
                <div style="color: var(--text);">Titular: ${titular}</div>
              </div>
            </div>
          `;
        }).join('');
      }, (error) => {
        paymentsList.innerHTML = `<div style="color: var(--danger);">Erro ao carregar pagamentos: ${error.message}</div>`;
      });
    }

    payButton.addEventListener('click', async () => {
      if (!currentUser) {
        setStatus('Faça login antes de pagar.', true);
        return;
      }

      const titular = String(titularInput.value || '').trim();
      if (!titular) {
        setStatus('Informe o nome do titular para continuar.', true);
        return;
      }

      try {
        await addDoc(collection(db, 'pagamentos_vipturbo'), {
          userId: currentUser.uid,
          titular: titular,
          valor: fixedValue,
          status: 'pendente',
          tipo: 'vip_turbo',
          data: serverTimestamp()
        });

        setStatus('Pagamento registrado. Redirecionando para o checkout PIX...', false);
        window.location.href = checkoutUrl;
      } catch (error) {
        setStatus(`Erro ao salvar pagamento: ${error.message}`, true);
      }
    });

    onAuthStateChanged(auth, (user) => {
      setUiForUser(user);
    });
  </script>
</body>
</html>
