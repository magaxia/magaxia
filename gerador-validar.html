<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Validação de códigos do Gerador." />
    <title>Gerador - Validação</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      .validation-panel {
        display: grid;
        gap: 18px;
      }
      .validation-panel form {
        display: grid;
        gap: 14px;
      }
      .validation-panel label {
        display: grid;
        gap: 8px;
        font-weight: 600;
      }
      .validation-result {
        margin-top: 18px;
        padding: 22px;
        border-radius: 24px;
        background: var(--panel-strong);
        border: 1px solid var(--border);
      }
      .detail-grid {
        display: grid;
        gap: 12px;
      }
      .detail-item {
        display: grid;
      }
      .detail-item span {
        color: var(--muted);
        font-size: 0.92rem;
      }
      .detail-item strong {
        font-size: 1.05rem;
        word-break: break-word;
      }
      .pills {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 10px;
      }
      .pill {
        padding: 10px 14px;
        border-radius: 999px;
        background: var(--panel);
        border: 1px solid var(--border);
        font-weight: 700;
      }
      .validation-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }
      .qr-card {
        display: grid;
        gap: 12px;
        margin-top: 18px;
        padding: 20px;
        border-radius: 24px;
        background: var(--panel);
        border: 1px solid var(--border);
      }
      .qr-card canvas {
        width: 180px;
        height: 180px;
        border-radius: 18px;
        background: white;
      }
      .page-header { margin-bottom: 22px; }
      .page-header h1 { margin-bottom: 8px; }
      .nav-links { margin-bottom: 20px; }
      @media (max-width: 700px) {
        .validation-actions { justify-content: stretch; }
        .qr-card { justify-items: center; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div>
            <h1>Gerador SaaS</h1>
            <p>Validação profissional</p>
          </div>
        </div>
        <nav class="nav-links">
          <a class="nav-btn" href="gerador-codigos.html">Códigos</a>
          <a class="nav-btn active" href="gerador-validar.html">Validar</a>
          <a class="nav-btn" href="gerador-detalhes.html">Detalhes</a>
          <a class="nav-btn" href="gerador-admin.html">Dashboard</a>
          <a class="nav-btn" href="gerador.html">Gerador</a>
        </nav>
        <div class="sidebar-footer">
          <p>Valide códigos diretamente na coleção vip5_gerador_codigos.</p>
        </div>
      </aside>
      <main class="main-content">
        <div class="page-header">
          <h1>Validação de código</h1>
          <p>Verifique imediatamente se um código existe, está ativo e os números sorteados.</p>
        </div>

        <div class="glass-card validation-panel">
          <form id="validateForm">
            <label>
              <span>Insira o código</span>
              <input id="codeInput" type="text" placeholder="EXEMPLO1234ABCD" autocomplete="off" />
            </label>
            <div class="validation-actions">
              <button type="submit" class="primary-btn">Validar</button>
              <button id="themeToggle" type="button" class="secondary-btn">Alternar tema</button>
            </div>
          </form>
          <div id="resultContainer"></div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script type="module" src="gerador-validar.js"></script>
  </body>
</html>
