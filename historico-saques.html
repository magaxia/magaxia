<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Histórico de Saques</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<!-- Sistema de Autenticação Centralizado -->
<script src="sistema-auth.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  visibility: hidden;
}

.container {
  max-width: 600px;
  width: 100%;
  text-align: center;
  padding: 25px;
}

.card {
  background: rgba(255, 255, 255, 0.1);
  padding: 25px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
}

h2 {
  font-size: 32px;
  margin-bottom: 20px;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
}

.saque-item {
  background: rgba(255, 255, 255, 0.1);
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 15px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  text-align: left;
}

.saque-item .valor {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 10px;
}

.saque-item .detalhes {
  font-size: 14px;
  opacity: 0.9;
  margin-bottom: 5px;
}

.saque-item .status {
  font-weight: bold;
  padding: 5px 10px;
  border-radius: 8px;
  display: inline-block;
  margin-top: 10px;
}

.status-pendente {
  background-color: #ffeb3b;
  color: #333;
}

.status-aprovado {
  background-color: #4caf50;
  color: white;
}

.status-rejeitado {
  background-color: #f44336;
  color: white;
}

.sem-saques {
  font-size: 16px;
  opacity: 0.8;
  margin-top: 20px;
}

@media (max-width: 600px) {
  .container {
    padding: 15px;
  }

  .card {
    padding: 20px;
  }

  h2 {
    font-size: 24px;
  }

  .saque-item {
    padding: 15px;
  }
}
</style>
</head>

<body>

<div class="container">
  <h2>📄 HISTÓRICO DE SAQUES</h2>

  <div class="card">
    <div id="lista-saques">
      <!-- Saques serão inseridos aqui dinamicamente -->
    </div>
  </div>
</div>

<script>

// Usando sistema-auth.js: auth e db já configurados (compat Firebase)

let uid = null;

const formatador = new Intl.NumberFormat(
  "pt-BR",
  {
    style: "currency",
    currency: "BRL"
  }
);

const formatadorData = new Intl.DateTimeFormat(
  "pt-BR",
  {
    day: "2-digit",
    month: "2-digit",
    year: "numeric"
  }
);

// =============================
// ESCUTAR SAQUES EM TEMPO REAL
// =============================

function escutarSaques() {
  window.SistemaAuth.db.collection("saques")
    .where("uid", "==", uid)
    .onSnapshot(snapshot => {
      const listaSaques = document.getElementById("lista-saques");
      listaSaques.innerHTML = "";

      if (snapshot.empty) {
        listaSaques.innerHTML = '<div class="sem-saques">Nenhum saque encontrado.</div>';
        return;
      }

      // Coletar todos os documentos
      const saques = [];
      snapshot.forEach(doc => {
        saques.push(doc.data());
      });

      // Ordenar por data decrescente (mais recentes primeiro)
      saques.sort((a, b) => {
        const dataA = a.dataSaque?.toDate?.() || new Date(a.dataSaque);
        const dataB = b.dataSaque?.toDate?.() || new Date(b.dataSaque);
        return dataB - dataA;
      });

      // Renderizar saques ordenados
      saques.forEach(saque => {
        const item = criarItemSaque(saque);
        listaSaques.appendChild(item);
      });
    }, error => {
      console.error("❌ Erro ao escutar saques:", error);
    });
}

function criarItemSaque(saque) {
  const item = document.createElement("div");
  item.className = "saque-item";

  const valorSolicitado = formatador.format(saque.valorSolicitado || 0);
  const taxa = formatador.format(saque.taxaSaque || 0);
  const valorLiquido = formatador.format(saque.valorLiquido || 0);
  const data = formatadorData.format(saque.dataSaque?.toDate?.() || new Date(saque.dataSaque));
  const status = saque.status || "pendente";

  let statusClass = "";
  let statusText = status.toUpperCase();

  switch (status.toLowerCase()) {
    case "pendente":
      statusClass = "status-pendente";
      break;
    case "aprovado":
      statusClass = "status-aprovado";
      break;
    case "processado":
      statusClass = "status-aprovado";
      break;
    case "rejeitado":
      statusClass = "status-rejeitado";
      break;
  }

  item.innerHTML = `
    <div class="valor">${valorSolicitado}</div>
    <div class="detalhes">Taxa: ${taxa}</div>
    <div class="detalhes">Recebe: ${valorLiquido}</div>
    <div class="detalhes">Data: ${data}</div>
    <div class="status ${statusClass}">${statusText}</div>
  `;

  return item;
}

// 🔐 Proteção de acesso
document.addEventListener('DOMContentLoaded', function() {
  console.log('🔐 Verificando autenticação no histórico de saques...');

  // Usar sistema centralizado para verificar login
  window.SistemaAuth.verificarLogin((autenticado, dadosUsuario) => {
    if (!autenticado) {
      console.log('❌ Usuário não autenticado, redirecionando para login...');
      window.location.href = 'login.html';
      return;
    }

    console.log('✅ Usuário autenticado, carregando histórico de saques...');

    // Inicializar uid
    uid = dadosUsuario.uid;

    // Tornar body visível
    document.body.style.visibility = "visible";

    // Escutar saques em tempo real
    escutarSaques();
  });
});

</script>

</body>
</html>
