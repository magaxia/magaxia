<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
  color: #fff;
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at 20% 50%, rgba(34, 197, 94, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
  pointer-events: none;
  z-index: -1;
}

.container {
  max-width: 460px;
  width: 90%;
  padding: 50px 40px;
  background: rgba(15, 23, 42, 0.7);
  backdrop-filter: blur(10px);
  border-radius: 20px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 
        inset 0 1px 1px rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.1);
  animation: slideUp 0.6s ease-out;
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.logo-section {
  text-align: center;
  margin-bottom: 18px;
}

.logo-icon {
  font-size: 3rem;
  margin-bottom: 8px;
  background: linear-gradient(135deg, #22c55e, #3b82f6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

h1 {
  font-size: 1.6rem;
  font-weight: 700;
  margin-bottom: 6px;
  background: linear-gradient(135deg, #22c55e, #3b82f6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.subtitle {
  font-size: 0.95rem;
  color: #cbd5e1;
  margin-bottom: 18px;
  font-weight: 300;
}

.form-group {
  margin-bottom: 12px;
  position: relative;
}

.form-group label {
  display: block;
  font-size: 0.85rem;
  color: #94a3b8;
  margin-bottom: 8px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

input, button {
  width: 100%;
  padding: 14px 16px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  font-size: 0.95rem;
  font-family: 'Inter', sans-serif;
  transition: all 0.3s ease;
}

input {
  background: rgba(255, 255, 255, 0.05);
  color: #fff;
}

input::placeholder {
  color: #64748b;
}

input:focus {
  outline: none;
  background: rgba(255, 255, 255, 0.08);
  border-color: #22c55e;
  box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1);
}

input[readonly] {
  opacity: 0.6;
  cursor: not-allowed;
  background: rgba(255, 255, 255, 0.03);
}

button {
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: #fff;
  font-weight: 600;
  cursor: pointer;
  border: none;
  margin-top: 10px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
}

button::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
  transition: left 0.5s ease;
}

button:hover::before {
  left: 100%;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
}

button:active {
  transform: translateY(0);
}

.msg {
  margin-top: 12px;
  font-size: 0.9rem;
  color: #3b82f6;
  padding: 8px 12px;
  background: rgba(59, 130, 246, 0.1);
  border-radius: 8px;
  border-left: 3px solid #3b82f6;
}

.divider {
  display: flex;
  align-items: center;
  margin: 18px 0;
  color: #64748b;
}

.divider::before,
.divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(255, 255, 255, 0.1);
}

.divider span {
  padding: 0 12px;
  font-size: 0.85rem;
}

.footer-link {
  margin-top: 12px;
  font-size: 0.95rem;
  color: #cbd5e1;
}

.footer-link a {
  color: #3b82f6;
  text-decoration: none;
  font-weight: 600;
  transition: all 0.3s ease;
}

.footer-link a:hover {
  color: #22c55e;
  text-decoration: underline;
}

@media (max-width: 480px) {
  .container {
    padding: 30px 20px;
    border-radius: 16px;
  }
    
  h1 {
    font-size: 1.5rem;
  }
    
  input, button {
    padding: 12px 14px;
    font-size: 0.9rem;
  }
}
</style>
</head>
<body>
  <div class="container">
  <h1>Entrar</h1>
  <input type="text" id="telefone" placeholder="Email, UID ou Telefone">
  <input type="password" id="senha" placeholder="Senha">
  <button id="btnEntrar" type="button" onclick="entrar()">Entrar</button>
  <p style="margin-top:8px; font-size:0.95rem; color:#cbd5e1">Não tem conta? <a href="#" id="linkCadastro">Criar conta</a></p>
  <p id="pendingStatus" style="margin-top:8px; color:#cbd5e1"></p>
</div>

<script>
// MESMA CONFIG DO FIREBASE (copie da sua página de cadastro se necessário)
const firebaseConfig = {
  apiKey: "AIzaSyAcVPgUHbL4N9U1-H68klmGKWQF-YGleyc",
  authDomain: "vastbitloud-2872a.firebaseapp.com",
  projectId: "vastbitloud-2872a",
  storageBucket: "vastbitloud-2872a.firebasestorage.app",
  messagingSenderId: "952931184412",
  appId: "1:952931184412:web:ee2a0e38826c30dd0cd4d9",
  measurementId: "G-KWVQ0CFHW2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ===============================
// 🔗 LINK PARA CADASTRO - APENAS QUANDO CLICADO PROPOSITALMENTE
// ===============================
document.addEventListener('DOMContentLoaded', function() {
  console.log('✅ Página carregada');
  const linkCadastro = document.getElementById('linkCadastro');
  if(linkCadastro){
    linkCadastro.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      console.log('🔗 Redirecionando para cadastro...');
      window.location.href = "index.html";
    });
  }
});

// Helper: retry async function with exponential backoff
async function retryAsync(fn, attempts = 4, delay = 1000){
  let lastErr;
  for(let i=0;i<attempts;i++){
    try{ return await fn(); }catch(e){
      lastErr = e;
      if(e && e.code === 'auth/network-request-failed'){
        const wait = delay * Math.pow(2,i);
        console.warn(`Network error, retrying in ${wait}ms`, e);
        await new Promise(r => setTimeout(r, wait));
        continue;
      }
      break;
    }
  }
  throw lastErr;
}

async function entrar(){
  console.log('🚀 Iniciando função entrar()...');
  
  const credencial = document.getElementById('telefone').value.trim();
  const senha = document.getElementById('senha').value.trim();
  
  console.log('📝 Credencial:', credencial);
  console.log('📝 Senha: [OCULTA]');
  
  if(!credencial || !senha){
    console.error('❌ Campos vazios');
    alert('❌ Preencha email/UID/telefone e senha.');
    return;
  }

  const statusEl = document.getElementById('pendingStatus');
  const botaoEntrar = document.getElementById('btnEntrar');
  
  console.log('✅ Elementos encontrados');
  
  if(botaoEntrar) {
    botaoEntrar.disabled = true;
    console.log('✅ Botão desabilitado');
  }

  try{
    console.log('🔄 Iniciando autenticação...');
    if(statusEl) statusEl.innerText = '🔍 Autenticando...';

    // Buscar TODOS os usuários COM RETRY para Firestore offline
    let snapshot;
    try {
      console.log('📡 Conectando ao Firestore...');
      snapshot = await retryAsync(() => db.collection('users').get(), 3, 2000);
      console.log('✅ Firestore conectado, ' + snapshot.size + ' usuários encontrados');
    } catch(retryErr) {
      console.error('❌ ERRO FIRESTORE:', retryErr);
      if(statusEl) statusEl.innerText = '❌ Erro de conexão com servidor.';
      if(botaoEntrar) botaoEntrar.disabled = false;
      alert('❌ Erro ao conectar ao servidor.\nVerifique sua internet e tente novamente.');
      return;
    }
    
    if(snapshot.empty){
      console.error('❌ Nenhum usuário encontrado');
      if(statusEl) statusEl.innerText = '❌ Sem usuários cadastrados';
      if(botaoEntrar) botaoEntrar.disabled = false;
      alert('❌ Nenhum usuário cadastrado no sistema.');
      return;
    }

    // Procurar o usuário por email OU uid OU telefone
    console.log('🔍 Procurando usuário com credencial: ' + credencial);
    let usuarioEncontrado = null;
    let tentativas = 0;
    
    for(const doc of snapshot.docs) {
      tentativas++;
      const userData = doc.data();
      
      console.log(`  Tentativa ${tentativas}: UID=${doc.id}, Email=${userData.email}, Telefone=${userData.telefone}`);
      
      // Busca por email OU uid OU telefone
      if(userData.email === credencial || doc.id === credencial || userData.telefone === credencial){
        console.log('✅ USUÁRIO ENCONTRADO! UID:' + doc.id);
        usuarioEncontrado = {
          uid: doc.id,
          ...userData
        };
        break;
      }
    }

    // Se não encontrou o usuário
    if(!usuarioEncontrado){
      console.error('❌ Usuário NÃO encontrado após verificar ' + tentativas + ' usuários');
      if(statusEl) statusEl.innerText = '❌ Credenciais inválidas';
      if(botaoEntrar) botaoEntrar.disabled = false;
      alert('❌ Usuário não encontrado.\nVerifique email, UID ou telefone.');
      return;
    }

    console.log('👤 Validando dados do usuário...');
    
    // Validar a senha
    const senhaFornecida = senha.trim().toLowerCase();
    const senhaArmazenada = (usuarioEncontrado.senha || '').trim().toLowerCase();
    
    console.log('🔐 Senha fornecida: ' + (senhaFornecida ? 'preenchida' : 'vazia'));
    console.log('🔐 Senha armazenada: ' + (senhaArmazenada ? 'existe' : 'não existe'));
    
    if(!usuarioEncontrado.senha || senhaFornecida !== senhaArmazenada){
      console.error('❌ Senha incorreta');
      if(statusEl) statusEl.innerText = '❌ Senha incorreta';
      if(botaoEntrar) botaoEntrar.disabled = false;
      alert('❌ Senha incorreta.');
      return;
    }

    console.log('✅ Senha validada');

    // Verificar se está ativo
    if(usuarioEncontrado.status === 'desativado'){
      console.error('❌ Usuário desativado');
      if(statusEl) statusEl.innerText = '❌ Usuário desativado.';
      if(botaoEntrar) botaoEntrar.disabled = false;
      alert('❌ Usuário desativado.');
      return;
    }

    console.log('✅ Usuário ativo');

    // Armazenar dados do usuário em sessionStorage
    console.log('💾 Salvando dados em sessionStorage...');
    try {
      const userDataToStore = {
        uid: usuarioEncontrado.uid,
        nome: usuarioEncontrado.nome,
        email: usuarioEncontrado.email,
        telefone: usuarioEncontrado.telefone,
        status: usuarioEncontrado.status,
        saldo: usuarioEncontrado.saldo || 0
      };
      
      console.log('📦 Dados a salvar:', userDataToStore);
      
      sessionStorage.setItem('userDados', JSON.stringify(userDataToStore));
      sessionStorage.setItem('userUID', usuarioEncontrado.uid);
      
      console.log('✅ Dados salvos com sucesso');
    } catch(storageErr) {
      console.error('❌ ERRO ao salvar sessionStorage:', storageErr);
      alert('❌ Erro ao salvar dados: ' + storageErr.message);
      if(botaoEntrar) botaoEntrar.disabled = false;
      return;
    }

    console.log('🎉 LOGIN BEM-SUCEDIDO! Redirecionando...');
    if(statusEl) statusEl.innerText = '✅ Login OK! Aguarde...';

    // Redirecionar APENAS após tudo estar correto
    setTimeout(() => {
      console.log('🔄 Redirecionando para painel.html');
      window.location.href = 'painel.html';
    }, 500);

  } catch(err){
    console.error('❌ ERRO CRÍTICO NA FUNÇÃO ENTRAR:', err);
    console.error('Stack:', err.stack);
    
    let mensagemErro = 'Erro desconhecido';
    
    if(err.message && err.message.includes('offline')) {
      mensagemErro = 'Firestore offline.';
    } else if(err.code === 'permission-denied') {
      mensagemErro = 'Permissão negada.';
    } else {
      mensagemErro = err.message || 'Erro ao fazer login';
    }
    
    console.error('💬 Mensagem de erro:', mensagemErro);
    if(statusEl) statusEl.innerText = '❌ ' + mensagemErro;
    if(botaoEntrar) botaoEntrar.disabled = false;
    alert('❌ ' + mensagemErro);
  }
}

</script>
</body>
</html>
